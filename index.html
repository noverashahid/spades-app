estions about the prompt's keywords to help them arrive at their own creative interpretation without giving them the answer.","points":40},{"text":"Break down the prompt into simpler terms and give them one broad, hypothetical example to kickstart their brainstorming process.","points":30},{"text":"Tell them that interpreting the complex abstraction is the entire point of the challenge and walk away to maintain strict fairness.","points":20},{"text":"Allow them to swap their prompt for an easier one with a point penalty, complicating the grading process for the judges.","points":10}]},{"question":"Three deadlines land in the same week: a deliverable for Pixel, a quiz, and a group project. What actually happens?","options":[{"text":"You knock out the quick wins to clear mental space, then focus on the big one.","points":40},{"text":"You do the hardest thing first while your energy is highest.","points":30},{"text":"You map out the week hour by hour and stick to it.","points":20},{"text":"You tell someone early that one of the three will be late, and pick which.","points":10}]},{"question":"You receive a submission that is visually breathtaking but completely fails to incorporate the required scientific concept. How should it be judged?","options":[{"text":"Score the design elements highly, but apply a strict penalty for missing the core scientific prompt to maintain fairness to other teams.","points":40},{"text":"Use the given explanation while submitting let the team express correctly if the science is hidden in a subtle visual metaphor, failing that specific criteria only if they cannot defend it.","points":30},{"text":"Fail the submission entirely; no matter how good it looks, ignoring the fundamental brief makes the entry invalid.","points":20},{"text":"Overlook the missing science because the stunning visuals elevate the overall quality of the event's showcase.","points":10}]},{"question":"A team claims another group overheard their brainstorming and stole their central idea for the design challenge. How do you handle the accusation?","options":[{"text":"Neutrally explain that parallel thinking is common under tight constraints and, without hard proof, neither team will be penalized, shifting their focus back to out-executing the other team.","points":40},{"text":"Quietly notify the Event Head and the judges to scrutinize both final submissions for originality, without interrupting either team's workflow during the round.","points":30},{"text":"Separate both teams and ask them to independently explain the origin of their concepts to the Event Head, which unnecessarily halts their progress and escalates the drama.","points":20},{"text":"Immediately confront the accused team and demand to see their working files to prove they didn't cheat.","points":10}]},{"question":"You need to explain a creative concept to someone who doesn't work in visuals at all. How do you do it?","options":[{"text":"Show them a reference from something they already know.","points":40},{"text":"Sketch it out roughly on the spot.","points":30},{"text":"Explain the feeling you want people to have, not the design itself.","points":20},{"text":"Skip the explanation and just build a quick mockup.","points":10}]},{"question":"Your event head is visibly stressed, frantically trying to fix a scheduling conflict, and snapping at people. How do you support them?","options":[{"text":"Step in and silently take over their minor logistical tasks so they have the mental space to solve the main crisis.","points":40},{"text":"Wait for a brief pause, then calmly offer to take the scheduling conflict off their plate entirely so they can manage the rest of the room.","points":30},{"text":"Give them space and stay completely out of their way, leaving them to handle the stress alone so you don't risk making it worse.","points":20},{"text":"Rally the rest of the organizing team to give the head a pep talk, wasting time and drawing unnecessary attention to their panic.","points":10}]},{"question":"During a brainstorming meeting, two loud, confident members are dominating the conversation. Three quieter members haven't spoken at all. The ideas being discussed are just \"okay.\"","options":[{"text":"Pivot the meeting to a \"silent brainstorm,\" having everyone write their ideas on sticky notes for 5 minutes to neutralize the loud voices and equalize input.","points":40},{"text":"Politely interrupt the loud members and explicitly ask the quieter members for their feedback on the ideas just proposed, bringing them directly into the fold.","points":30},{"text":"Wait until after the meeting and take the quiet members aside privately to ask for their ideas, though this fails to fix the team dynamic at the moment.","points":20},{"text":"Let the loud members run the whole meeting because their enthusiasm will drive the execution, even if the ideas remain mediocre.","points":10}]},{"question":"A teammate stops responding two days before submission. Their part is unfinished. What's your move?","options":[{"text":"Keep trying to reach them while starting a stripped-down backup version.","points":40},{"text":"Redistribute their work across the rest of the team and move on.","points":30},{"text":"Finish their part yourself and sort it out afterwards.","points":20},{"text":"Escalate to the department head immediately.","points":10}]},{"question":"A participating team loses all their digital files due to a software crash 30 minutes before the deadline. How do you respond?","options":[{"text":"Calm the team down and instruct them to rapidly sketch their concepts on paper and write a brief text summary so they still have a structured, physical submission for the judges to evaluate.","points":40},{"text":"Enforce the strict deadline, but allow them to submit whatever rough notes or partially saved assets they can recover, evaluating them solely on what is turned in.","points":30},{"text":"Give them a quick 15-minute extension to rebuild what they can, even though it delays the master schedule and gives them a slight time advantage over others.","points":20},{"text":"Pause the entire competition for all teams to let them recover their data out of fairness to their hard work.","points":10}]}]},{"name":"Kepler's Paradigm","questions":[{"question":"You are reviewing a physics round intended for high-school students. During internal test-solving, you find that one question is consistently taking significantly longer than expected, while another is being solved almost immediately by everyone. The problem setter argues that the difficult question will help separate the strongest teams. What is the best approach?","options":[{"text":"Keep both questions, since having a few questions that strongly distinguish the top teams is useful in a competitive round.","points":20},{"text":"Replace the difficult question with a moderately challenging one and keep the easier question, ensuring that participants are able to progress through the round without getting stuck.","points":10},{"text":"Have additional team members independently test both questions under realistic time constraints, then use their performance to decide whether either question needs modification before finalizing the paper.","points":30},{"text":"Evaluate both questions in the context of the round's intended difficulty progression, marks, expected solving time, and overall balance; retain or modify them based on whether they serve a clear purpose within the paper rather than judging difficulty in isolation.","points":40}]},{"question":"A participant solves a difficult mechanics problem using a method that was not anticipated by the problem setters. Their solution is significantly shorter than the official solution but appears mathematically valid. What should the grading team do?","options":[{"text":"Award marks according to the official marking scheme unless the alternative method explicitly demonstrates the same intermediate reasoning.","points":20},{"text":"Verify the alternative method independently and, if valid, accept it and update the marking guidance so mathematically equivalent approaches receive appropriate credit.","points":40},{"text":"Award substantial partial credit for reaching the correct result, while referring the solution to the problem setters before awarding full marks.","points":30},{"text":"Ask the participant to explain their method orally before deciding whether it demonstrates sufficient understanding to receive full credit.","points":10}]},{"question":"Ten minutes before an experimental round, you discover that several of the required sensors are producing inconsistent readings. The round is about to begin and there is no time to replace all of them. What is the best response?","options":[{"text":"Start the round as scheduled, instructing teams to repeat measurements where readings appear inconsistent and allowing graders to account for the resulting variation.","points":20},{"text":"Delay the round briefly to test all available sensors, identify the faulty units, and distribute the functioning equipment as evenly as possible before beginning.","points":30},{"text":"Replace the affected measurement with a theoretical value provided to all teams, allowing the experimental component to proceed using the remaining apparatus.","points":10},{"text":"Rapidly determine the extent of the equipment failure, isolate unreliable units, deploy any tested alternatives, and establish one standardized procedure for all affected teams so that the experimental conditions remain as fair as possible.","points":40}]},{"question":"A 45-minute experimental round is running 12 minutes behind schedule because equipment distribution took longer than expected. You still have two rounds planned afterward. What should the event team do?","options":[{"text":"Shorten each remaining round slightly so that the overall event still ends close to the original scheduled time, while preserving the order of activities.","points":30},{"text":"Allow the experimental round to continue for its planned duration, then recover the lost time by compressing breaks and transitions between the remaining rounds.","points":20},{"text":"Cancel or significantly shorten the least important later activity so that the core competitive rounds retain their intended duration.","points":10},{"text":"Identify which parts of the remaining schedule are genuinely time-critical, preserve the integrity of the main competitive activities, adjust transitions or lower-priority components where possible, and communicate the revised schedule clearly to all relevant teams.","points":40}]},{"question":"During a major round, you simultaneously receive reports that one room has insufficient answer sheets, another room has a malfunctioning projector, and a participant claims a question is incorrect. You are one of the available department members. What do you do?","options":[{"text":"Address the disputed question first because an academic error could affect every participant, while asking another team member to handle the answer-sheet shortage.","points":30},{"text":"Contact the Event Head with all three issues and wait for instructions so that no action is taken without authorization.","points":10},{"text":"Personally resolve whichever issue appears most urgent, then move sequentially through the remaining problems so that each receives your direct attention.","points":20},{"text":"Quickly assess which problems affect fairness or the continuation of the round, delegate solvable logistical issues to available members, and establish a clear process for verifying the disputed question before communicating any correction.","points":40}]},{"question":"You are designing a 20-minute experimental physics challenge for teams of 3–4 high-school students. The activity should test experimental design, data collection, uncertainty analysis, and physical reasoning. You have a limited supply of inexpensive, reusable equipment. Which approach is strongest?","options":[{"text":"Give each team a standardized apparatus and procedure, requiring them to collect several measurements, calculate the relevant quantity, and report their experimental uncertainty.","points":30},{"text":"Give teams the same basic apparatus but allow them to choose their measurement procedure, with marks primarily based on the accuracy of their final value and the quality of their uncertainty calculation.","points":20},{"text":"Give different teams slightly different apparatus and ask them to independently determine an unknown quantity, rewarding successful measurements while allowing teams to choose their own procedure and analysis.","points":10},{"text":"Give teams a constrained set of equipment and a clearly defined physical objective, but leave the measurement strategy open; assess the quality of their experimental design, data, uncertainty analysis, interpretation, and final conclusion rather than simply rewarding the closest numerical answer.","points":40}]},{"question":"Two members of the problem-setting team strongly disagree about a proposed physics problem. One argues that it is too difficult for the intended participants, while the other believes it is an appropriate challenge. Both have reasonable arguments and neither is willing to change their position. What is the best way to resolve the disagreement?","options":[{"text":"Ask the Event Head to make the final decision, since continued disagreement risks delaying the paper.","points":20},{"text":"Have both members independently explain what assumptions they are making about participant ability, then test the problem with several people who match the target participant level before deciding.","points":30},{"text":"Keep the problem but reduce its marks so that it can function as a high-difficulty discriminator without having too large an impact on the overall score.","points":10},{"text":"Define the intended difficulty and learning objectives first, have independent test-solvers attempt the problem under realistic time constraints, and use their performance and feedback alongside the setters' arguments to make an evidence-based decision.","points":40}]},{"question":"Your team has been asked to introduce an astrophysics component, but you have limited access to telescopes and cannot rely on clear weather. Which concept is strongest for a competitive event?","options":[{"text":"Give teams printed star charts and observational clues and ask them to identify constellations and celestial objects, with additional questions testing their knowledge of the objects identified.","points":20},{"text":"Organize an observation-based round using telescopes when conditions permit, while preparing a theoretical astronomy quiz as a backup in case weather prevents observations.","points":30},{"text":"Provide teams with astronomical images and datasets and ask them to identify objects and extract basic properties, with marks awarded for both identification and calculations.","points":10},{"text":"Provide simulated observational data, images, and relevant physical information and ask teams to infer quantities or properties such as stellar classification, distance, luminosity, or motion, making the activity competitive without depending on equipment or weather.","points":40}]},{"question":"You have 30 teams participating in an experimental round, but there are only five identical apparatus setups available. Each team requires approximately 15 minutes to complete the experiment. Which approach is most effective?","options":[{"text":"Divide teams into groups and rotate them through the five stations, allowing teams that finish early to begin analyzing their data while they wait for the next available station.","points":30},{"text":"Build several simplified versions of the apparatus so that more teams can work simultaneously, even if the measurements are not perfectly identical across setups.","points":20},{"text":"Allow teams to choose when they want to use an apparatus during a longer open period, giving them flexibility while minimizing idle equipment.","points":10},{"text":"Create timed rotations with standardized setup and reset procedures, assign teams to stations in advance, and ensure that equivalent experimental conditions and timing are maintained across groups.","points":40}]},{"question":"You have three weeks before the event. You are simultaneously responsible for submitting five problem drafts, testing an experimental setup, preparing material lists, and completing an unrelated university deadline that falls in the same week. You realize that completing everything at the last minute would create a significant risk of errors. What is the best approach?","options":[{"text":"Complete the problem drafts first because they have the earliest departmental deadline, then shift attention to the experiment and logistics while reserving time near the end for the university deadline.","points":20},{"text":"Break each responsibility into smaller tasks, set earlier personal deadlines, and maintain progress across the different deliverables rather than completing one responsibility entirely before starting another.","points":30},{"text":"Prioritize the event responsibilities for the next two weeks, since they involve coordination with other team members, while setting aside specific time closer to the deadline to complete the university work.","points":10},{"text":"Plan the three weeks around deadlines and task dependencies, giving earlier attention to work that could delay other members or reveal problems in the experimental setup, while leaving enough flexibility to handle the university deadline.","points":40}]},{"question":"One week before the event, you discover that an experimental apparatus you planned to use is unreliable and cannot consistently produce usable data. The experiment has already been included in the schedule and promotional material. What should you do?","options":[{"text":"Continue working on the original apparatus for several days, since replacing the experiment this close to the event could create unnecessary disruption, and decide on a backup once you know whether the repairs succeed.","points":20},{"text":"Switch to a simpler experiment using equipment that is already reliable, even if this means changing some of the activity's original learning objectives and format.","points":30},{"text":"Keep the original experiment as planned but prepare instructions for a theoretical version that can be used if the apparatus fails during the event, avoiding major changes to the advertised schedule.","points":10},{"text":"Set a clear testing deadline for the original setup; if it cannot meet the required reliability by then, move to a simpler tested version that retains the core experimental objective rather than continuing to depend on uncertain repairs.","points":40}]},{"question":"You are working on an experimental activity with three other team members. One member has repeatedly missed their assigned tasks and has not responded to messages, leaving the rest of the team to pick up their work. The event is approaching and some of their responsibilities are becoming time-sensitive. What is the best approach?","options":[{"text":"Take over their remaining tasks yourself so that the work is completed on time, and discuss the issue with them after the event.","points":20},{"text":"Message them directly, explain the impact of the missed work, and ask them to complete their pending responsibilities by a specific deadline while you continue with your own tasks.","points":30},{"text":"Reassign their tasks among the other members immediately and inform the team lead that the member has not been contributing, since the priority is ensuring that the event preparation stays on track.","points":10},{"text":"Speak to the member directly to understand the reason for the missed work, agree on specific responsibilities and deadlines they can realistically meet, and involve the team lead if the problem continues or begins affecting critical deliverables.","points":40}]},{"question":"During a live physics round, a participant approaches you after seeing their score and argues that a question was ambiguous. They claim that their interpretation is physically valid, while the official marking scheme assumes a different interpretation. The round has already ended. What should you do?","options":[{"text":"Explain that the marking scheme was finalized before the event and therefore the score should remain unchanged unless the Event Head decides otherwise.","points":10},{"text":"Hear the participant's reasoning, compare it with the wording of the question and intended solution, and consult the relevant problem setter before making any change to the score.","points":30},{"text":"Ask the participant to submit their argument for review later so that the event schedule is not disrupted, while continuing to use the existing marking scheme for now.","points":20},{"text":"Review whether the participant's interpretation is physically and logically supported by the question as written, compare it with the intended solution and marking scheme, and apply any necessary correction consistently to all affected participants.","points":40}]},{"question":"During testing of an experimental round, two members obtain noticeably different results using the same apparatus. One argues that the unusual result should simply be discarded as an outlier, while the other believes it may indicate a systematic issue with the setup. What should the team do?","options":[{"text":"Repeat the measurement several times and use the average of the results to reduce the effect of the unusual measurement.","points":20},{"text":"Compare both sets of measurements and check whether differences in procedure, apparatus handling, or calculation could explain the discrepancy before deciding how to proceed.","points":30},{"text":"Keep the result that is closer to the theoretical value, since this is more likely to represent what the experiment was intended to produce.","points":10},{"text":"Examine the raw data, measurement procedure, uncertainty, and possible systematic effects before deciding whether the result is an outlier, and use the findings to determine whether the setup or instructions need modification.","points":40}]},{"question":"A team member proposes an ambitious experimental activity that would be engaging and scientifically interesting, but it requires some new equipment, additional materials, and more setup and reset time than your usual activities. The event has a fixed budget and multiple teams will participate. What is the best response?","options":[{"text":"Test the activity with the available equipment and estimate its material cost and reset time before deciding whether it is practical for the event.","points":30},{"text":"Reject the proposal and use a simpler activity with existing equipment, since reliability, cost, and ease of execution should take priority close to the event.","points":10},{"text":"Keep the main idea but modify the setup to reduce material costs and simplify the reset process while preserving the activity's main experimental objective.","points":20},{"text":"Compare the activity with the team's budget, available resources, preparation time, and expected number of teams before deciding whether the original design or a modified version is more suitable.","points":40}]}]},{"name":"Siege","questions":[{"question":"A balloon-powered boat moves forward when air escapes from the balloon. Which explanation best describes why this happens?","options":[{"text":"Air is pushed backward out of the balloon, producing an equal and opposite reaction that propels the boat forward.","points":40},{"text":"The compressed air escaping from the balloon creates a force that is transferred through the boat and causes it to move forward.","points":30},{"text":"The escaping air reduces the pressure around the boat, allowing the surrounding water to push it forward.","points":20},{"text":"As air escapes, the balloon becomes lighter, causing the boat to become lighter and accelerate forward.","points":10}]},{"question":"You find a team using their phones to aid their engineering process. What's the best course of action:","options":[{"text":"Subtly but firmly warm them that they have received one warning after which they will lose marks.","points":40},{"text":"Call a head and ask them to make a decision.","points":30},{"text":"Tell them they are disqualified.","points":20},{"text":"Scold them publicly and give them a warning.","points":10}]},{"question":"A catapult is firing but the projectile isn't going far enough, what's the issue?","options":[{"text":"The elastic isn't stretched enough to generate enough force.","points":40},{"text":"The elastic is faulty.","points":30},{"text":"The design is incorrect.","points":20},{"text":"The structure is weak.","points":10}]},{"question":"During your category, you notice a delegate is being repeatedly harassed by another delegate. What is the best course of action?","options":[{"text":"Check in with the delegate privately and inform your event heads so they inform the respective person in charge so the situation can be handled through the appropriate procedure.","points":40},{"text":"Calmly intervene, make sure the delegate feels safe and inform event heads, while keeping an eye on the situation to make sure it does not continue.","points":30},{"text":"Ask the person involved to stop and continue monitoring the situation, involving the EO only if the behaviour happens again.","points":20},{"text":"Avoid getting involved unless the delegate directly complains, since stepping in without a complaint could make the situation more complicated.","points":10}]},{"question":"You notice your fellow team member is having a heated discussion with a delegate about a rule. As a team manager, what should you do?","options":[{"text":"Listen to both sides calmly, ask your team member to take a breather, and direct the delegate to discuss the matter with the Event Head or review the instruction manual. If the situation escalates, contact the respective EO.","points":40},{"text":"Step in calmly, remind both sides to keep the discussion respectful, and suggest checking the instruction manual or consulting the Event Head if the disagreement continues.","points":30},{"text":"Ask your team member to step away from the discussion and handle the delegate yourself so the situation does not escalate further.","points":20},{"text":"Support your team member and ask the delegate to stop arguing, since allowing delegates to challenge volunteers could undermine the team's authority.","points":10}]},{"question":"Your thermocol boat is placed in water but sinks instead of floating. What is the most likely explanation?","options":[{"text":"The boat's weight is too large relative to the amount of water it displaces, so the upward buoyant force is insufficient to support it.","points":40},{"text":"The boat may have been constructed in a way that allows water to enter or may have an uneven weight distribution affecting its buoyancy.","points":30},{"text":"The boat may be sitting too low in the water because its design creates too much resistance against the surrounding water.","points":20},{"text":"The balloon may not be producing enough thrust to keep the boat above the water.","points":10}]},{"question":"A delegate asks you for a hint because another team apparently received one from a different volunteer. What is the best response?","options":[{"text":"Check the rules and consult the category leadership about the inconsistency before deciding whether the same assistance should be provided to all teams.","points":40},{"text":"Give the delegate the same hint the other team reportedly received so that both teams have access to the same information.","points":30},{"text":"Explain that you cannot provide a hint yourself and ask them to continue according to the instructions unless the Event Head says otherwise.","points":20},{"text":"Give the delegate a different hint of similar difficulty so that neither team receives exactly the same advantage.","points":10}]},{"question":"You see 2 Delegates getting into a heated argument over materials that seems to be on the verge of becoming a physical confrontation, what's the best course of action?","options":[{"text":"Get in the middle with minimal physical contact and try to calm them down whilst asking a fellow member to contact a head or phone calling a head.","points":40},{"text":"Try and call an event head to the scene as soon as possible.","points":30},{"text":"Physically apprehend both to prevent anyone getting hurt and to put an end to the situation quickly without interrupting the event progress.","points":20},{"text":"Sit tight and wait for event heads to intervene.","points":10}]},{"question":"You notice a team has a faulty elastic that doesn't allow their catapult to fire. Changing it for them would allow others to demand material replacements that aren’t deserved. What would you do?","options":[{"text":"Have it replaced.","points":40},{"text":"You ask the heads to investigate and have it changed if the need is genuine.","points":30},{"text":"Pity their luck and feel bad for them.","points":20},{"text":"You replace it and if anyone else tries to take advantage of the situation you reprimand them.","points":10}]},{"question":"You notice a fellow team member trying to favor his former school during testing by giving them undue favors, what do you do?","options":[{"text":"Alert the heads in secret so that they may do whatever seems to be the best course of action.","points":40},{"text":"Both A and C.","points":30},{"text":"Lecture your fellow team members in private and remind them of the integrity of the event.","points":20},{"text":"Lecture them publicly to create an example.","points":10}]},{"question":"You are testing two boat designs made from the same amount of thermocol. Boat A has a wide, flat base while Boat B is narrow and tall. Which design would generally be more stable on water?","options":[{"text":"Boat A, because its wider base generally provides greater stability and makes it less likely to tip.","points":40},{"text":"Boat B, because its greater height allows it to displace more water.","points":30},{"text":"Both will have exactly the same stability because they contain the same amount of thermocol.","points":20},{"text":"Boat B, because a taller structure automatically has a lower centre of gravity.","points":10}]}]},{"name":"Carson's Lab","questions":[{"question":"A university replaces the roofs of three buildings with green roofs. Six months later, the roofs are absorbing less heat than expected. Your team has one week to decide what to change. You find that: ● Roof A has very healthy plants but gets almost no wind. ● Roof B has poor plant growth but receives strong wind. ● Roof C looks unhealthy, but its temperature is closest to the target. You can only make one change to one roof. What do you choose?","options":[{"text":"Leave the roofs unchanged and repeat the measurements under different weather conditions before modifying anything.","points":40},{"text":"Change the plants on Roof A to varieties that tolerate warmer, less ventilated conditions.","points":30},{"text":"Change the growing medium on Roof B to retain more water.","points":20},{"text":"Change the structure around Roof C so that more air can move across its surface.","points":10}]},{"question":"You're given a simple game with one rule: You must make every decision using only information that was available to you before the game began. After playing for a while, you realize that following the rule is making you consistently lose. You cannot change the rule. What do you do?","options":[{"text":"Work backwards from your losses to identify what your current strategy is missing.","points":40},{"text":"Try deliberately making a few decisions that seem unreasonable and see whether they produce a different pattern.","points":30},{"text":"Continue following the rule and try to find a better strategy using the information you already have.","points":20},{"text":"Stop trying to win and try to understand why the rule was designed this way.","points":10}]},{"question":"A town has a system that collects and processes 83% of its household waste. Nobody knows what happens to the remaining 17%. Your team is given six months to deal with the problem. There is enough money to pursue only one of these approaches.","options":[{"text":"Study the 17% itself and determine what materials make up the missing waste.","points":40},{"text":"Study households that produce unusually little waste and see whether their practices can be reproduced elsewhere.","points":30},{"text":"Study the collection system and identify where waste could be disappearing between households and processing facilities.","points":20},{"text":"Ignore the 17% initially and try to reduce the total amount of waste entering the system.","points":10}]},{"question":"Suppose you are leading a round and teams are performing an activity, you caught a team cheating and using AI, what will you do and how will you handle the situation at that moment?","options":[{"text":"You'll just inform the problem to your society higher ups","points":40},{"text":"Giving them a second chance","points":30},{"text":"Ignoring the problem completely","points":20},{"text":"Straightforward eliminating the team from the event","points":10}]},{"question":"Suppose you are leading a round, a team is working in the chemistry lab and they mistakenly broke an apparatus and a toxic chemical spills, what will you do and explain how you will manage the situation?","options":[{"text":"Inform the Lab incharge and higher ups immediately and ask them to wash themselves quickly","points":40},{"text":"Ask them to wash themselves quickly and clean the spill with clean water","points":30},{"text":"Clean the spill with a tissue paper and distilled water","points":20},{"text":"Fine the team for breaking the apparatus","points":10}]},{"question":"A team consists of some delegates that were juniors in your school, they reach out to you and ask for bonus marks or try to bribe you to help them in winning the event, what will you do in this situation?","options":[{"text":"Explain them that it is unfair to other teams and against your society values","points":40},{"text":"Ignore their messages completely and tell them you did not have time to check your mobile phone","points":30},{"text":"Argue with them and tell them you will try it if possible","points":20},{"text":"Give them a few bonus marks because it is alright in friendships","points":10}]},{"question":"A factory wants to reduce the amount of pollution entering a nearby river. It installs a new treatment system, and laboratory tests show that the concentration of the targeted pollutant in the wastewater has decreased significantly. However, six months later, the river ecosystem appears to be getting worse rather than better. Your team has limited time and funding to investigate. What do you do first?","options":[{"text":"Investigate whether reducing the targeted pollutant may have changed other properties of the wastewater or ecosystem that are contributing to the decline.","points":40},{"text":"Compare the river's condition before and after the treatment system was installed to identify any other environmental changes occurring at the same time.","points":30},{"text":"Improve the treatment system further to remove an even greater percentage of the targeted pollutant.","points":20},{"text":"Assume that the ecosystem needs more time to recover and continue operating the system without further investigation.","points":10}]},{"question":"A community wants to produce clean drinking water, but conventional treatment technologies are too expensive to install and maintain. Your team has three months and enough funding to develop only one initial approach. What do you choose?","options":[{"text":"Investigate locally available materials, natural processes, and existing infrastructure to identify an unconventional treatment approach that can be tested and adapted to the community.","points":40},{"text":"Study low-cost water treatment technologies used successfully in similar communities and adapt the most suitable one.","points":30},{"text":"Design a simplified version of a conventional treatment system using cheaper materials.","points":20},{"text":"Recommend waiting until sufficient funding becomes available for a conventional treatment plant.","points":10}]},{"question":"A city notices that electricity consumption has increased significantly over the past five years. The city government assumes that population growth is the primary cause and plans to build additional power infrastructure. Before committing to the plan, your team is asked to investigate the problem. What is the most effective approach?","options":[{"text":"Examine whether population growth actually explains the increase by investigating other possible factors, such as changes in consumption patterns, technology, industry, infrastructure, or energy efficiency.","points":40},{"text":"Compare electricity consumption trends in similar cities with similar population growth to see whether the same pattern occurs.","points":30},{"text":"Calculate future electricity demand based primarily on projected population growth and recommend infrastructure accordingly.","points":20},{"text":"Accept the government's explanation and focus on determining how quickly new power infrastructure can be built.","points":10}]}]},{"name":"Diagnosis Dilemma","questions":[{"question":"Linked Genes: Reading the Whole Prediction Genes A and B are linked. An individual with arrangement AB/ab is test-crossed with ab/ab. The recombination frequency is 18%. Assume equal viability of all offspring. Every statement below is scientifically correct. Which gives the MOST complete and useful prediction of the offspring pattern?","options":[{"text":"The two parental phenotypes together should account for about 82% of the offspring, while the two recombinant phenotypes together should account for about 18%.","points":40},{"text":"AB/ab and ab/ab should each occur at about 41%, while Ab/ab and aB/ab should each occur at about 9%.","points":30},{"text":"A parental-type offspring is expected to be much more common than a recombinant-type offspring because most gametes are non-recombinant.","points":20},{"text":"AB/ab and ab/ab should tie as the two most frequent individual offspring classes.","points":10},{"text":"The recombinant classes should be the minority because the recombination frequency is well below 50%.","points":0}]},{"question":"Oxygen Transport: Active Tissue Actively respiring muscle has more CO₂, a lower pH and a higher temperature than blood in the lungs. Every statement below is correct under these conditions. Which statement BEST connects these changes to the physiological purpose of haemoglobin in the tissue?","options":[{"text":"At the same partial pressure of oxygen, haemoglobin will tend to have a lower percentage saturation in the active tissue than under lung-like conditions.","points":40},{"text":"The dissociation curve shifts to the right, reflecting a reduction in haemoglobin’s affinity for oxygen.","points":30},{"text":"The Bohr effect makes it easier for oxygen to unload where respiration is producing more carbon dioxide and hydrogen ions.","points":20},{"text":"The combined effect of increased CO₂, reduced pH and higher temperature lowers oxygen affinity and promotes oxygen delivery to the metabolically active tissue.","points":10},{"text":"If haemoglobin concentration is unchanged, these conditions mainly alter oxygen affinity and unloading rather than the maximum amount of oxygen that haemoglobin can bind when fully saturated.","points":0}]},{"question":"Same Genome, Different Cell A neuron and a skeletal-muscle cell from the same person contain essentially the same genome but have very different structures and functions. All of the following statements are correct. Which is the BEST overall explanation of how such differences are produced and maintained?","options":[{"text":"Different cell types maintain different patterns of gene activity through combinations of transcription factors, regulatory DNA, chromatin state and other layers of gene regulation.","points":40},{"text":"Alternative RNA processing can allow the same gene to contribute different RNA or protein products in different cell types.","points":30},{"text":"Epigenetic marks and chromatin organisation can help stabilise cell-type-specific patterns of gene expression across cell divisions.","points":20},{"text":"Post-transcriptional and translational regulation can make protein abundance differ even when two cells contain transcripts from some of the same genes.","points":10},{"text":"Cell specialisation depends less on having different genes than on using shared genetic information in different combinations, amounts and contexts.","points":0}]},{"question":"Apoptosis: Strength of Evidence A compound reduces the number of cultured cancer cells after 24 hours. Several follow-up findings are obtained, and every finding below is compatible with apoptosis. Which would provide the STRONGEST evidence that apoptosis, rather than another form of cell loss, is the principal mechanism?","options":[{"text":"Microscopy shows cell shrinkage, chromatin condensation and membrane blebbing in many treated cells.","points":40},{"text":"Treated cells show externalisation of phosphatidylserine before widespread loss of plasma-membrane integrity.","points":30},{"text":"A DNA-fragmentation assay becomes strongly positive after treatment.","points":20},{"text":"Mitochondrial cytochrome c release is detected soon after exposure to the compound.","points":10},{"text":"Two independent assays show executioner-caspase activation together with early phosphatidylserine externalisation, while membrane integrity is initially preserved.","points":0}]},{"question":"Association, Confounding and Causation Plants of the same species growing beside a busy road have less chlorophyll than plants sampled 2 km away. Every evaluation below is scientifically valid. Which is the BEST evaluation of the claim that vehicle pollution caused the difference?","options":[{"text":"Using the same species reduces one obvious biological source of variation, so the comparison is stronger than comparing unrelated species.","points":40},{"text":"A larger sample would improve precision and reduce the influence of random sampling variation, although it would not by itself remove systematic site differences.","points":30},{"text":"The observation supports an association, but a stronger causal claim requires controlling or measuring plausible alternatives such as light, water, nutrients, leaf age and disease.","points":20},{"text":"Statistical significance could strengthen confidence that the observed difference is not just random sampling noise, but it would not by itself establish causation.","points":10},{"text":"The roadside pattern is biologically useful evidence for generating or supporting a pollution hypothesis even though an observational comparison cannot isolate every causal factor.","points":0}]},{"question":"Marking an Equivalent Scientific Answer A marking key expects “water moves into the cell by osmosis.” A participant instead writes that water moves across the partially permeable membrane from higher water potential to lower water potential. The answer is scientifically equivalent, and several scripts have already been marked. Every response below is defensible. Which is the BEST response?","options":[{"text":"Accept the scientifically equivalent wording for the current script and record the issue so the key can be clarified before the next event.","points":40},{"text":"Pause final scoring of that item long enough for a second marker to confirm equivalence, then apply the same interpretation to all affected scripts.","points":30},{"text":"Accept the answer now and instruct remaining markers to accept the same wording, then audit earlier scripts if the result could affect qualification.","points":20},{"text":"Preserve the participant’s response and flag the item for moderation before final results, rather than making an irreversible ruling at the desk.","points":10},{"text":"Treat the wording as correct because the concept, not the exact term, is being tested, and re-check all already-marked responses for scientifically equivalent formulations before finalising scores.","points":0}]},{"question":"Correcting an Organiser-Caused Disadvantage In a timed station you tell one team to begin at Question 4 instead of Question 1. The questions can be attempted in any order, but the team loses about two minutes trying to understand the unexpected sequence before working normally. Every action below could form part of a reasonable remedy. Which is the BEST immediate response?","options":[{"text":"Correct the instruction, let the team continue, and note the incident so any effect can be considered during moderation.","points":40},{"text":"Correct the instruction and give back the full seven minutes that elapsed before you noticed, choosing to over-compensate rather than risk under-compensating.","points":30},{"text":"Correct the instruction, explain briefly that question order is flexible, and allow the team to continue from whichever question they prefer.","points":20},{"text":"Correct the instruction immediately, restore approximately the time actually lost because of the confusion, document the adjustment, and avoid compensating for time in which useful work was still completed.","points":10},{"text":"Correct the instruction and preserve the team’s existing work, while arranging a later review of whether any question-specific disadvantage remained.","points":0}]},{"question":"Friendship, Honesty and Operational Recovery Your close friend forgot to print an answer sheet and asks you to say the printer malfunctioned if anyone asks. Ten minutes remain before delegates arrive, and the sheets can still be printed if both of you pause a non-urgent task. Every option below contains a reasonable element. Which is the BEST overall response?","options":[{"text":"Refuse the false explanation, focus first on getting the sheets printed, and let your friend own the mistake if an explanation is actually needed.","points":40},{"text":"Ask your friend to start printing immediately while you cover the paused task, then discuss the attempted excuse privately once the operational risk has passed.","points":30},{"text":"Print the sheets together, make a brief factual note of the near-miss for the post-event debrief, and avoid turning a solved problem into a public confrontation.","points":20},{"text":"Tell your friend that honesty is non-negotiable, ask them to notify the relevant team member of the delay, and help them finish the printing before delegates arrive.","points":10},{"text":"Refuse to lie, repair the problem jointly, keep any explanation factual and proportionate, and ensure the missed responsibility is addressed afterward rather than hidden or dramatised during the crisis.","points":0}]},{"question":"Bioinformatics Station: Internet Failure A sequence-analysis station depends on an online tool. Twelve teams complete it normally before the internet fails; the remaining teams have not started. You have a pre-tested offline packet containing the same query sequences, saved search outputs and the same scoring rubric. Every response below is defensible. Which is the BEST way to preserve both fairness and the learning objective?","options":[{"text":"Use the offline packet for the remaining teams and document the change, because the biological reasoning and scoring targets remain the same even though the interface differs.","points":40},{"text":"Pause the station briefly, verify that the saved outputs exactly correspond to the intended queries, then switch remaining teams to the offline packet under the same time and scoring rules.","points":30},{"text":"Allow the first twelve teams to keep their results but exclude interface-speed elements from scoring if those elements cannot be reproduced offline.","points":20},{"text":"Convert the station for the remaining teams into interpretation of the saved outputs rather than live searching, while keeping only learning objectives common to both versions in the score.","points":10},{"text":"Use the verified offline packet, neutralise any marks that depended specifically on live-tool navigation, preserve the common biological-analysis marks, and record the contingency so every team is compared only on equivalent evidence.","points":0}]},{"question":"Correcting Misinformation Without Undermining a Teammate During a live station, a junior organiser gives a delegate a technically inaccurate explanation. The error is unlikely to affect the delegate’s score, but leaving it uncorrected would teach the biology incorrectly. All five actions below are appropriate at some stage. Which should take PRIORITY?","options":[{"text":"After the interaction, give the organiser a concise private explanation of what was inaccurate and how to explain it correctly next time.","points":40},{"text":"For the rest of the session, stay nearby and quietly support the organiser on technical questions until their confidence and accuracy improve.","points":30},{"text":"Briefly and neutrally correct the scientific point for the delegate in the moment, without framing the organiser as incompetent, then debrief the organiser privately afterward.","points":20},{"text":"Give the organiser a short reference sheet or approved explanation for the concept so the same error is less likely to recur.","points":10},{"text":"If the same error repeats after feedback, temporarily shift the organiser toward a role that does not require independent technical explanation.","points":0}]},{"question":"Timing Fault With an Audit Trail After a 30-minute MCQ eliminator, you discover that one team’s timer remained open for 35 minutes. The platform log shows that the team submitted all answers by minute 28 and made no changes afterward. All responses below are reasonable parts of quality control. Which deserves the HIGHEST priority before results are finalised?","options":[{"text":"Document the timer fault and correct the system configuration before the next round so the defect cannot recur.","points":40},{"text":"Independently verify the platform log and, if it confirms no answers were changed or newly submitted after minute 30, retain the team’s score without a competitive penalty.","points":30},{"text":"Check whether the platform allowed any hidden advantage after submission, such as viewing feedback or reopening answers, before treating the audit trail as conclusive.","points":20},{"text":"Keep a record of the irregularity with the score so the decision can be explained transparently if another team later asks about timing consistency.","points":10},{"text":"Review whether any element of the round rewarded speed itself; if it did, ensure the timer fault did not affect that component even though answers were submitted before the deadline.","points":0}]}]},{"name":"Drones","questions":[{"question":"While testing a newly built drone on the bench, one motor gets noticeably hotter than the other three within 30 seconds of spinning without propellers. How do you investigate?","options":[{"text":"Swap the warm motor with a cool motor on another arm to see if the heat issue follows the motor or stays with the ESC/wiring.","points":40},{"text":"Increase the motor timing in the configuration software to force the motor to run smoother.","points":30},{"text":"Assume it's a defective motor and immediately submit a request to purchase a replacement.","points":20},{"text":"Ignore it for now and attach propellers to see if airflow during flight cools the motor down naturally.","points":10}]},{"question":"You are writing the post project documentation for a drone build that suffered three major crashes during development. How do you frame these failures in the final report?","options":[{"text":"Detail the root cause of each crash, the repair process, and the design modifications that can be made to prevent them in the future.","points":40},{"text":"Briefly mention the crashes but focus more on the work that was put in as compared to previous designs and try to frame it as a learning curve","points":30},{"text":"Mention the crashes as a joke to make the report entertaining.","points":20},{"text":"Omit the crashes entirely to make the project look like a complete success.","points":10}]},{"question":"A brushless motor runs significantly hotter than the other three during a 30 second bench test without propellers. How do you start investigating?","options":[{"text":"Swap the hot motor with a cool one on another arm to isolate whether it's a motor issue or an ESC/wiring issue.","points":40},{"text":"Connect the drone to configuration software to analyze digital sensor logs and motor timing parameters.","points":30},{"text":"Inspect the physical motor bell, wire solder joints, and mounting screws for mechanical friction or shorts.","points":20},{"text":"Put propellers on and run a brief low altitude flight test to see if ambient airflow cools it down.","points":10}]},{"question":"You notice a potential voltage mismatch in a teammate's wiring diagram just before they start soldering. How do you approach them?","options":[{"text":"Ask them to walk you through their wiring plan so you can double-check the voltage specs together.","points":40},{"text":"Hand them the component datasheets and point out the voltage rating difference directly.","points":30},{"text":"Propose testing the circuit with a bench power supply set to low voltage before wiring it permanently.","points":20},{"text":"Bring it up during the next quick team sync so everyone is aligned on the power distribution plan.","points":10}]},{"question":"A drone exhibits a mild drift to the left during hovering. Before adjusting electronic settings or trims, what physical check do you prioritize?","options":[{"text":"Check the physical balance and center of gravity by adjusting the position of the battery on the frame.","points":40},{"text":"Check that all four motor mounts are level and that no frame arm is slightly twisted or loose.","points":30},{"text":"Inspect the propellers for subtle bends, cracks, or uneven wear across the four arms.","points":20},{"text":"Verify that the flight controller board is mounted perfectly level on its anti-vibration standoffs.","points":10}]},{"question":"The team is stuck choosing between an Analog video setup (cheaper, lower latency) and a Digital setup (clearer image, higher cost). How do you help break the tie?","options":[{"text":"Compare both options strictly against the department's primary goal","points":40},{"text":"Analyze the remaining budget to see which option leaves more safety margin for spare parts and crashes.","points":30},{"text":"Suggest building one primary digital rig and one low-cost analog secondary rig to get the best of both worlds.","points":20},{"text":"Survey the team to see which system members have the most hands-on experience maintaining and fixing.","points":10}]},{"question":"While assembling a complex frame section, you realize you installed an inner plate backward, requiring 30 minutes of teardown to fix. What do you do?","options":[{"text":"Pause, document where the instruction or diagram was ambiguous, and then disassemble and fix it.","points":40},{"text":"Immediately take it apart and rebuild it correctly so the mistake doesn't cascade into later steps.","points":30},{"text":"Finish the rest of the frame build first, leaving the correction for the end of the session.","points":20},{"text":"Check if you can adapt or modify the remaining attachments without taking the sub assembly apart.","points":10}]},{"question":"You are assigned to configure a radio link protocol (e.g., ExpressLRS) that you have never used before. What is your learning strategy?","options":[{"text":"Read the official documentation and setup guides thoroughly from start to finish before opening the software.","points":40},{"text":"Watch a step by step video tutorial while following along directly with your hardware plugged in.","points":30},{"text":"Ask a senior member or peer who knows the protocol for a quick 10-minute walk through to get you started.","points":20},{"text":"Dive straight into the software, explore the settings menu, and learn by experimenting hands on.","points":10}]}]},{"name":"Math Gauge","questions":[{"question":"Your problem-setting teammate submits 25 original math questions two weeks before the event. What is the most effective vetting procedure before sending the questions to print?","options":[{"text":"Have the problem creator write official solution keys and have the whole team check the work via shared document comments.","points":30},{"text":"Run blind test-solving sessions with at least two team members who have never seen the problems, timing them and hunting for alternate interpretations.","points":40},{"text":"Use online plagiarism checkers and AI to search for duplicate questions online.","points":20},{"text":"Print the test directly to keep the problem set confidential and avoid leaks.","points":10}]},{"question":"Fifteen minutes into a 60-minute round, an invigilator confirms that Question 8 has a typo making it unsolvable. What is the immediate, standard course of action?","options":[{"text":"Void Question 8 immediately, announce to all rooms to skip it, and award full marks to everyone at the end.","points":30},{"text":"Spend 15 minutes calculating an alternative question, write it on the whiteboards, and add 15 minutes to the overall clock.","points":20},{"text":"Quietly tell only the participants who raised their hands and noticed the typo so the rest of the room isn't disturbed.","points":10},{"text":"Verify the fix centrally, write the exact correction on a central white/blackboard in every hall simultaneously, and log time impact for grading adjustments.","points":40}]},{"question":"A high school competitor uses an advanced university-level theorem to solve a 10-point geometry/algebra problem in two lines. The official rubric planned for a 10-step Euclidean proof. How should this be scored?","options":[{"text":"0 points, because the method exceeds the competition syllabus.","points":20},{"text":"Partial credit, because they bypassed the intended problem-solving thought process.","points":30},{"text":"Full credit, provided the theorem was stated accurately, applicable, and mathematically sound.","points":40},{"text":"Disqualify the response and require the student to re-solve it during an interview ( suspicion of AI use.","points":10}]},{"question":"Twenty minutes into a 90-minute high-stakes individual round, a 16-year-old participant begins hyperventilating, crying silently, and stops writing entirely. How should the event team intervene?","options":[{"text":"Announce to the room that the round is designed to be difficult to normalize their feelings.","points":30},{"text":"Discreetly signal an available invigilator/teammate to gently guide the student outside into a quiet holding space, offer water, and determine if they feel able to resume with adjusted time if permitted by policy.","points":40},{"text":"Leave the student alone at their desk so they are not embarrassed in front of their peers.","points":10},{"text":"Ask the delegate if they’d like to switch places with another teammate/drop out of the round entirely, with no marks awarded.","points":20}]},{"question":"An audience member shouts out a decisive hint (\"Use Cauchy-Schwarz\") right after a student buzzes in, but before they speak.","options":[{"text":"Call a stage freeze, discard the question, issue a direct warning that further audience hints will force an empty-hall policy, and serve a fresh reserve problem to the stage.","points":40},{"text":"Allow the buzzing team to finish their response, but require them to verbally prove and derive the Cauchy-Schwarz step from scratch to verify organic knowledge.","points":30},{"text":"Accept the answer if correct, but penalize the school affiliated with the shouting spectator by deducting points from their delegation score.","points":20},{"text":"Ignore the shout entirely and award the points if the buzzing contestant gives the correct numerical answer within their remaining time.","points":10}]},{"question":"In a live countdown face-off, a participant buzzes and states: \"The answer is 60°.\" The host's solution sheet explicitly requires an angle in radians (pi/3). The student insists their response is mathematically equivalent based on how the host read the prompt.","options":[{"text":"Offer the contestant a 5-second window to state the radian equivalent without losing floor control.","points":30},{"text":"Pause the match clock, pull up the written prompt to check if \"in radians\" was explicitly mandated; if not, award full credit for mathematical equivalence.","points":40},{"text":"Rule it incorrect and open the floor to the opposing team.","points":10},{"text":"Mark the answer incorrect on the spot, but file the incident for post-match scoring adjustment in case a tiebreaker is required in round/winner cutoffs.","points":20}]},{"question":"In an auction/point-gamified math round, the leading team intentionally buzzes early on questions they don't know just to exhaust the question timer, taking small negative penalties to run down the clock and protect their lead. Opponents are visibly frustrated.","options":[{"text":"Stop the clock and adjust game rules mid-round by requiring teams to write a coherent first step on a whiteboard before buzzing.","points":20},{"text":"Disqualify the leading team immediately for violating the collaborative spirit of PSIFI","points":10},{"text":"Allow the round to conclude under the published rules as written, but initiate a fast review of the penalty structure before the next bracket to scale up negative points for unattempted buzzes.","points":40},{"text":"Directly curbs poor sportsmanship, but injects subjective referee discretion (\"what counts as frivolous?\") into a game round.","points":30}]},{"question":"Two days before the exam print cutoff, your Event Heads get into an escalating argument. Event Head 1 insists on including a highly abstract topology problem that 95% of delegates will fail, while Event Head 2 insists on replacing it with an accessible combinatorics question. They refuse to speak to each other, blocking the final draft.","options":[{"text":"Immediately flag the stalemate to higher authority / Academic Officers, laying out the print-deadline risk and requesting an executive tiebreaker so the team doesn’t miss the printing window.","points":20},{"text":"Discreetly approach Event Head 1 privately to persuade them to move their topology problem to an optional \"tiebreaker / bonus\" slot, pitching it as a way to preserve their question without blowing up the paper's base difficulty.","points":30},{"text":"Stay out of the conflict entirely since neither head reports to you, continue formatting the problems that are agreed upon, and wait for them to work it out among themselves before taking further action.","points":10},{"text":"Compile an objective comparison memo cross-referencing both problems against the published study guide, estimated solve times, and historical scoring data, then present it to both leads in a structured manner to aid an objective decision, escalating to the Academic Officers only if the deadlock remains past the deadline.","points":40}]},{"question":"During late-night paper grading, you notice one of your teammates giving generous partial credit to delegates from their own former school, arguing that \"they clearly had the right intuition even if the arithmetic failed.\"","options":[{"text":"Verbally reprimand the volunteer at the grading table, manually deduct the extra points on the specific papers, and watch them closely while they grade the rest.","points":20},{"text":"Allow the marks to stand to preserve morale, but balance it by instructing other teammates to be slightly more lenient with competing schools.","points":10},{"text":"Report the teammate to the Event Heads and ask them to recheck the stack for unfair marking.","points":40},{"text":"Relieve the teammate of grading duties, recheck the stack they were assigned and redistribute the work amongst the other teammates, (Assign them another task that doesn't require grading)","points":30}]},{"question":"Right after official scores are posted, an aggressive delegate storms up to you in the round room, slams their paper on your desk, and loudly accuses you of personal bias, claiming your rubric deliberately robbed their school of 1st or Runners up. Other delegates are gathering to watch.","options":[{"text":"Keep your tone low and steady, ask them to step to a less crowded area, hear their grievance fully without interruption, and then walk them through the rubric to reassure their worries.","points":40},{"text":"Firmly state that aggressive accusations violate the delegate code of conduct, and tell them you will not review their paper until they speak to you respectfully.","points":20},{"text":"Apologize for the distress and grant a provisional point increase on the spot to defuse the crowd and keep the schedule moving.","points":10},{"text":"Inform your Event Heads about the issue and redirect the delegate’s concerns and the harassment you were subjected to towards them.","points":30}]}]},{"name":"RoboArm Project","questions":[{"question":"It is your second week on Flagship A. Your subteam has several things it wants to improve, but nobody has assigned you a specific task yet. You have some free time before the next meeting.","options":[{"text":"Review the project and identify an area where you could contribute.","points":40},{"text":"Ask the team lead what needs attention and take their suggested task.","points":30},{"text":"Learn more about the project until someone gives you something specific.","points":20},{"text":"Wait for the next meeting so you avoid overlapping with someone else.","points":10}]},{"question":"Your team is testing a mechanism that has worked several times before. Today it keeps failing in slightly different ways. Several quick fixes have already been attempted without success.","options":[{"text":"Ask another member to take over and try solving the problem differently.","points":20},{"text":"Keep making small changes until one of them produces a stable result.","points":30},{"text":"Put the issue aside temporarily and work on another part instead.","points":10},{"text":"Compare the failed attempts and use their differences to plan the next test.","points":40}]},{"question":"During a brainstorming session, someone suggests an unusual way to improve the robot's eventual sorting task. It sounds interesting, but nobody knows whether the current hardware could support it.","options":[{"text":"Suggest keeping the idea for later while developing the current system first.","points":30},{"text":"Ask what problem the idea solves and explore a smaller testable version.","points":40},{"text":"Point out the hardware limitations and return to the original approach.","points":20},{"text":"Encourage pursuing the idea immediately because unusual ideas can stand out.","points":10}]},{"question":"Your work depends on something another member was supposed to finish. They have been unavailable for several days, and the deadline is approaching. You have never worked on their part before.","options":[{"text":"Wait for them to return because changing their work could create problems.","points":10},{"text":"Tell the team lead that your progress is blocked and await further instructions.","points":20},{"text":"Start rebuilding their part independently so the deadline remains unaffected.","points":30},{"text":"Learn enough about their part to stay productive while keeping everyone informed.","points":40}]},{"question":"Your team is choosing between two possible solutions. Both seem reasonable, but people have started defending their preferred option rather than discussing the actual problem.","options":[{"text":"Suggest comparing the assumptions, risks, and expected results of both approaches.","points":40},{"text":"Suggest trying whichever approach appears easier to implement first.","points":20},{"text":"Let the more experienced member choose which approach the team follows.","points":30},{"text":"Stay neutral and let the discussion continue until everyone reaches agreement.","points":10}]},{"question":"Your basic robot arm is finally working reliably. Someone proposes adding an ambitious vision feature before the next demonstration. It could improve the demo, but time is limited.","options":[{"text":"Reject the idea for now because the existing system already works.","points":20},{"text":"Start building the feature immediately while the idea is still fresh.","points":10},{"text":"Ask the team to compare the feature's value, effort, and possible risks.","points":40},{"text":"Suggest adding the feature only if the current system stays reliable.","points":30}]},{"question":"Your newly assembled robot arm reaches its target reasonably well when moving slowly. At higher speeds, however, the arm begins shaking and sometimes stops slightly away from the target. Which would be the most useful thing to investigate first?","options":[{"text":"Whether the camera is identifying the target from a different position.","points":20},{"text":"Whether the arm structure and joints remain stable during movement.","points":40},{"text":"Whether the gripper needs additional force to reach the target correctly.","points":10},{"text":"Whether the movement algorithm should generate a more complex path.","points":30}]},{"question":"During testing, three joints move approximately as expected, but one joint consistently rotates farther than commanded. The same error appears whenever that joint receives the same command. What would you investigate first?","options":[{"text":"Whether the camera is incorrectly detecting the arm's workspace.","points":10},{"text":"Whether the gripper is changing the balance of the entire arm.","points":20},{"text":"Whether that joint has an incorrect calibration or position mapping.","points":40},{"text":"Whether the entire arm requires a different movement sequence.","points":30}]},{"question":"Your arm works normally when one servo moves. When several servos move simultaneously, some become weak or reset unexpectedly. The software appears to be sending the commands correctly. What would you investigate?","options":[{"text":"Whether the camera is processing images quickly enough during movement.","points":10},{"text":"Whether the movement algorithm is generating too many commands.","points":30},{"text":"Whether the gripper needs recalibration before testing multiple joints.","points":20},{"text":"Whether the power supply and wiring support simultaneous motor demand.","points":40}]},{"question":"The camera detects a red object reliably in one part of the workspace but struggles when the exact same object is moved elsewhere. The object itself has not changed. Which investigation would be most useful?","options":[{"text":"Check whether lighting or background conditions change across the workspace.","points":40},{"text":"Check whether the arm's joints are moving at the correct speed.","points":20},{"text":"Check whether the gripper can hold the object securely in each position.","points":10},{"text":"Check whether another object produces more consistent detection results.","points":30}]},{"question":"You ask the robot to move its gripper to the same location twice. From one starting position it reaches the target smoothly; from another starting position it takes a very different route. What would best explain this difference?","options":[{"text":"The camera must be identifying the target differently each time.","points":10},{"text":"The robot can use different joint configurations to reach the same position.","points":40},{"text":"The power supply must change whenever the starting position changes.","points":20},{"text":"The gripper must have a different weight during the second movement.","points":30}]},{"question":"Your team records four trials while testing the arm: Trial Speed Payload Result 1 Low Light Accurate 2 High Light Inaccurate 3 Low Heavy Accurate 4 High Heavy Inaccurate You want to understand what is most likely affecting accuracy.","options":[{"text":"Test different payloads while keeping the speed fixed.","points":30},{"text":"Test different speeds while keeping the payload fixed.","points":40},{"text":"Change both speed and payload together to see larger differences.","points":10},{"text":"Repeat the highest-speed trial because it produced the largest error.","points":20}]},{"question":"You joined Flagship A because building a robot sounded exciting. A few weeks later, you spend an afternoon repeating tests, recording results, and recalibrating the same mechanism. What would you most likely do?","options":[{"text":"Finish the testing but request more interesting work afterward.","points":30},{"text":"Suggest that experienced members handle repetitive testing whenever possible.","points":20},{"text":"Focus on another task because repetitive work feels less valuable to you.","points":10},{"text":"Complete the testing carefully and look for patterns that improve future testing.","points":40}]}]},{"name":"Registration & Accommodations","questions":[{"question":"How would you describe your approach to teamwork?","options":[{"text":"I actively contribute, communicate, and help the team achieve its goals","points":40},{"text":"I complete my assigned tasks and support the team when needed","points":30},{"text":"I prefer working independently but can collaborate when required","points":20},{"text":"I usually wait for others to assign me tasks","points":10}]},{"question":"If you are given multiple tasks with the same deadline, what would you do?","options":[{"text":"Prioritize them based on urgency and importance and create a plan","points":40},{"text":"Complete them one by one based on their difficulty","points":30},{"text":"Work on all of them simultaneously","points":20},{"text":"Wait until the deadline is close and then complete them","points":10}]},{"question":"How would you handle a disagreement with a team member?","options":[{"text":"Discuss the issue calmly and work toward a solution that benefits the team","points":40},{"text":"Listen to their perspective and then explain my own","points":30},{"text":"Ask team lead to resolve the disagreement","points":20},{"text":"Avoid the disagreement and continue with my own approach","points":10}]},{"question":"What do you think we could do to improve SPADES’ outreach and reach more students?","options":[{"text":"Explore new outreach channels, approach different student groups, and suggest creative campaigns","points":40},{"text":"Increase promotion through existing social media and campus channels","points":30},{"text":"Ask other team members to help with outreach","points":20},{"text":"Continue using the existing methods and wait for registrations","points":10}]},{"question":"If you have an important academic deadline and a task due on the same day, what would you do?","options":[{"text":"Plan ahead, communicate early, and manage both responsibilities accordingly","points":40},{"text":"Complete the academic work first and then finish the task","points":30},{"text":"Ask a team member for help if necessary","points":20},{"text":"Wait until the deadline approaches before deciding","points":10}]},{"question":"A participant is confused about the registration process and keeps asking the same questions. How would you respond?","options":[{"text":"Patiently explain the process and guide them through each step until their registration is complete","points":40},{"text":"Explain the process and share the relevant registration guidelines","points":30},{"text":"Direct them to the registration FAQ or information provided","points":20},{"text":"Ask them to contact someone else for assistance","points":10}]},{"question":"You notice that the information in the registration sheet does not match the details submitted through the registration form. How would you handle the situation?","options":[{"text":"Cross-check both sources, contact the participant if needed, and update the record","points":40},{"text":"Confirm the discrepancy with a team member before making any changes","points":30},{"text":"Inform the directors and wait for their instructions before proceeding","points":20},{"text":"Leave the information unchanged until it is addressed later","points":10}]}]},{"name":"Socials & Operations","questions":[{"question":"It’s 4:30 PM. A ceremony starts at 6:00 PM. The vendor was supposed to arrive at 3:30 PM but says, “Bas 20 minutes mein pohanch raha hoon.” What do you do?","options":[{"text":"Inform your director that the vendor is late and wait for instructions.","points":20},{"text":"Call the vendor, get their exact location and ETA, communicate the delay to your director, identify what can be prepared without them, and keep following up until they arrive.","points":40},{"text":"Assume they’ll arrive soon because there is still 1.5 hours left.","points":10},{"text":"Call the vendor repeatedly and tell them they absolutely need to hurry.","points":30}]},{"question":"You’re given a spreadsheet containing 70 guests, their contact information, PR status, arrival time, and assigned event. You notice several entries are inconsistent or missing. What do you do?","options":[{"text":"Only fix the entries you personally need for your assigned task.","points":20},{"text":"Leave it because whoever made the spreadsheet probably knows what they’re doing.","points":10},{"text":"Clean and standardize the sheet, flag missing information, verify what you can, and create a clear way to track unresolved entries.","points":40},{"text":"Highlight the incomplete cells and ask the relevant people to fill them.","points":30}]},{"question":"An artist’s manager quotes you PKR 650,000. Your approved budget is PKR 500,000. What is your first approach?","options":[{"text":"Tell them your maximum budget is PKR 500,000 and ask if they can match it.","points":30},{"text":"Tell them another artist has offered PKR 450,000 even though that isn’t true.","points":10},{"text":"Understand what the quote includes, ask about flexibility, negotiate professionally using your event and platform as leverage, and explore adjustments to the package.","points":40},{"text":"Immediately start looking for another artist within budget.","points":20}]},{"question":"You have been standing at a venue supervising setup for three hours. The carpeting is done, but some chairs are misaligned, the backdrop isn’t centered, and the vendor says, “Sir bas theek hai, nobody will notice.” What do you do?","options":[{"text":"Let it go because the vendor has more experience with setups.","points":10},{"text":"Fix the most noticeable problems and let the minor ones go.","points":30},{"text":"Politely but firmly have the incorrect elements fixed before signing off on the setup.","points":40},{"text":"Send pictures to your director and ask whether the setup is acceptable.","points":20}]},{"question":"Your team needs three possible concepts for an opening ceremony in two days. You’ve never planned an opening ceremony before. What do you do?","options":[{"text":"Search Pinterest, Instagram, and TikTok and send interesting setups you find.","points":20},{"text":"Research other events and previous SPADES events, genera
