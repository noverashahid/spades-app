te concepts, check their practical feasibility and cost, and present your strongest options.","points":40},{"text":"Ask your director what exact concept they want before starting.","points":10},{"text":"Brainstorm several ideas with friends or team members and present the best ones.","points":30}]},{"question":"During the event, you are carrying refreshments from one building to another when a vendor calls saying they need someone at the concert venue immediately. What do you do?","options":[{"text":"Immediately go to the vendor because the concert is more important.","points":20},{"text":"Call your director and wait for them to decide what you should do.","points":10},{"text":"Assess which task is more time-sensitive, coordinate with a teammate to cover one of them, and make sure neither task gets abandoned.","points":40},{"text":"Finish the refreshments task as quickly as possible and then head to the venue.","points":30}]},{"question":"A vendor becomes irritated during a negotiation and says, “Aap log students ho, aapko rates ka idea nahi hai.” What do you do?","options":[{"text":"Respond firmly that you know the market and that they’re overcharging you.","points":10},{"text":"Stay calm, ask them to break down the quotation, compare it with your requirements and market information, and continue negotiating professionally.","points":40},{"text":"Tell them you have other quotations and ask them for their best final rate.","points":30},{"text":"End the conversation and find another vendor who is easier to work with.","points":20}]},{"question":"Your director asks, “What’s the status of tomorrow’s closing ceremony setup?” Which response would you ideally be able to give?","options":[{"text":"“Everything is mostly confirmed; I’m just checking one or two things.”","points":30},{"text":"“I’ll call everyone right now and update you.”","points":10},{"text":"“Stage confirmed for 4 PM, chairs and tables at 4:30, carpeting confirmed, vendor contact saved, quotation approved, and one lighting item is still pending which I’m following up on.”","points":40},{"text":"“The vendor said everything will be ready.”","points":20}]},{"question":"It’s 11:30 PM during the flagship event. You’ve already been working most of the day. Your assigned event is over, but another Social & Operations setup is understaffed. What do you do?","options":[{"text":"Ask whether they genuinely need you because your assigned work is already finished.","points":20},{"text":"Check with the team and help wherever you’re most needed before leaving.","points":40},{"text":"Leave because everyone should be responsible for their own assigned event.","points":10},{"text":"Help for a while but leave once the immediate rush has been handled.","points":30}]},{"question":"You have quotations from three vendors. Vendor A is the cheapest but has been unreliable. Vendor B costs 12% more but has consistently delivered. Vendor C is the most expensive but offers the best-looking setup. Which approach do you take?","options":[{"text":"Choose Vendor C because Social events need to look as impressive as possible.","points":10},{"text":"Choose Vendor B because reliability generally justifies a moderate premium.","points":30},{"text":"Compare cost, reliability, quality, event requirements, and available budget before making and justifying a recommendation.","points":40},{"text":"Choose Vendor A because staying under budget should be the priority.","points":20}]},{"question":"You have 45 minutes before an event and suddenly receive five different tasks from different people. What do you do?","options":[{"text":"Ask your director which task they want you to do first.","points":20},{"text":"Start with whichever task has the closest deadline and work through them sequentially.","points":30},{"text":"Start with the easiest tasks so you can clear your task list quickly.","points":10},{"text":"Quickly prioritize them by urgency and dependency, identify what only you can do, delegate what can be delegated, and communicate accordingly.","points":40}]},{"question":"You’re told at 5 PM that 150 extra chairs are needed by 7 PM. Your usual vendor says they can’t provide them. What do you do?","options":[{"text":"Ask the usual vendor if they know someone who can arrange them while also calling alternatives yourself.","points":30},{"text":"Explain that arranging 150 chairs with two hours’ notice isn’t realistically possible.","points":10},{"text":"Immediately contact alternative vendors and resources, check what can be sourced internally, coordinate transport and logistics, and keep the relevant lead updated.","points":40},{"text":"Tell your director immediately and ask what they want you to do.","points":20}]},{"question":"A senior team member gives you an instruction that you think will cause a logistical problem later. What do you do?","options":[{"text":"Follow the instruction because they probably know something you don’t.","points":20},{"text":"Raise the concern respectfully, explain the likely consequence, suggest an alternative, and then follow the final decision.","points":40},{"text":"Do it your own way because you’ll be responsible if it goes wrong.","points":10},{"text":"Ask them whether they’re sure before proceeding.","points":30}]},{"question":"During a high-pressure setup, your director hasn’t replied for 10 minutes and a vendor needs an immediate minor decision. What do you do?","options":[{"text":"Keep calling your director until they answer.","points":20},{"text":"Tell the vendor they must wait because you haven’t received authorization.","points":10},{"text":"Ask another experienced department member for their judgment.","points":30},{"text":"If the decision is within your responsibility and is low-risk or reversible, make the best-informed decision and update your director.","points":40}]},{"question":"You discover that you personally made an error in a vendor sheet that could affect tomorrow’s setup. Nobody else has noticed yet. What do you do?","options":[{"text":"Correct the sheet immediately and only mention the mistake if it has already affected something.","points":30},{"text":"Ask a teammate what they think you should do before telling anyone.","points":20},{"text":"Correct what you can immediately, inform whoever needs to know, clearly explain the potential impact, and help implement the solution.","points":40},{"text":"Quietly fix it because admitting the mistake unnecessarily could create panic.","points":10}]}]},{"name":"3D Printing","questions":[{"question":"No budget cap, no deadline, no supervisor. You build one thing for a month. What is it?","options":[{"text":"Something that does one small thing beautifully and serves no practical purpose.","points":40},{"text":"A fix for something that annoys you every single day.","points":30},{"text":"A tool the department keeps needing and does not have.","points":20},{"text":"Something built to win the next competition you enter.","points":10}]},{"question":"Rank these by how much they would ruin your week.","options":[{"text":"Someone moved your tools and did not say where.","points":40},{"text":"Uncommented code you have to modify tonight.","points":30},{"text":"One unlabeled cable in a bundle of twelve.","points":20},{"text":"A single missing M3 screw.","points":10}]},{"question":"You get 10 thousand rupees and three weeks to build a demo. How do you scope it?","options":[{"text":"One feature that works reliably, with enough budget held back to rebuild it once.","points":40},{"text":"Something ambitious with features trimmed as the deadline approaches.","points":30},{"text":"A kit you modify into your own version so you start from a working baseline.","points":20},{"text":"The strongest components you can afford with the scope shaped around what you end up with.","points":10}]},{"question":"You walk into the lab and catch a smell. Rank these by how fast you move.","options":[{"text":"Burning insulation.","points":40},{"text":"Hot plastic somewhere nothing should be heating.","points":30},{"text":"Ozone near a power supply.","points":20},{"text":"Solder flux from a bench nobody is sitting at.","points":10}]},{"question":"Your project has to survive being carried across campus in a rickshaw.","options":[{"text":"Nothing loose, everything screwed down, every cable given strain relief before it moves, moving parts ziptied.","points":40},{"text":"A padded box and a written plan for reassembling it on arrival.","points":30},{"text":"Broken into subassemblies, each carried separately and joined at the venue.","points":20},{"text":"Carried flat and level, with the driver asked to take it slow.","points":10}]},{"question":"Your team runs four tests on a part that keeps failing. Trial 1: cool, slow. Passed. Trial 2: cool, fast. Passed. Trial 3: warm, slow. Passed. Trial 4: warm, fast. Failed. What do you test next?","options":[{"text":"Repeat trial 4 to confirm it fails consistently, then hold it warm and sweep the speed.","points":40},{"text":"Hold the speed fast and sweep temperature, since trial 2 passed at that same speed.","points":30},{"text":"Add trials between the four settings to find where the failure starts.","points":20},{"text":"Move both variables together in smaller steps to reach the boundary faster.","points":10}]},{"question":"It is three in the morning. One bug left. Presentation at nine.","options":[{"text":"Message the teammate who is still awake and pair on it.","points":40},{"text":"Sleep three hours and restart at six.","points":30},{"text":"Keep going alone while the whole system is still loaded in your head.","points":20},{"text":"Freeze the bug, build a demo path that routes around it, and present what works.","points":10}]},{"question":"You have been stuck on one problem for a while. When do you ask for help?","options":[{"text":"At around forty-five minutes, arriving with a list of everything you have ruled out.","points":40},{"text":"As soon as you are stuck.","points":30},{"text":"At hour three, once you have exhausted your own ideas.","points":20},{"text":"Next time you see the right person, rather than interrupting them for it.","points":10}]},{"question":"A teammate has missed three deadlines.","options":[{"text":"Ask them directly what is blocking them, then redistribute based on the answer.","points":40},{"text":"Raise it with the department head before it reaches the final build.","points":30},{"text":"Cover their share through this deadline and talk to them once it is done.","points":20},{"text":"Put it to the whole team so the workload gets rebalanced in the open.","points":10}]},{"question":"Your idea gets rejected in a planning meeting.","options":[{"text":"Ask what the specific objection is, then come back with a prototype that answers it.","points":40},{"text":"Back the chosen plan and commit to it fully.","points":30},{"text":"Make the case again in the room, with the reasoning you have.","points":20},{"text":"Build it in your own time and show them once it works.","points":10}]},{"question":"Your subsystem works. Nobody else on the team knows how to use it.","options":[{"text":"Document the wiring and comment the code so anyone can pick it up next week.","points":40},{"text":"Walk two teammates through it at the workbench.","points":30},{"text":"Record a video explaining it and share it with the team.","points":20},{"text":"Stay reachable as the person who knows it and answer questions as they come.","points":10}]},{"question":"A build fails two hours before the showcase.","options":[{"text":"Strip it back to the smallest version that runs and demo that.","points":40},{"text":"Isolate subsystems one at a time until you find the break.","points":30},{"text":"Hand it to whoever built that section and support them.","points":20},{"text":"Ask the organizers for a later slot and use the extra time.","points":10}]},{"question":"Someone hands you a component you have never touched. What is your first move?","options":[{"text":"Read the datasheet, wire a minimal test circuit, and confirm it works in isolation.","points":40},{"text":"Find a tutorial, replicate the wiring exactly, then adapt it once something responds.","points":30},{"text":"Ask a senior member to walk you through it.","points":20},{"text":"Connect it to the build on a current-limited supply and watch what it draws.","points":10}]},{"question":"Your servo jitters every time the DC motor spins up. What do you check first?","options":[{"text":"Whether the motor and the logic board share one power rail, browning out the servo on every spike.","points":40},{"text":"Whether decoupling capacitors are in place across the supply.","points":30},{"text":"Whether the servo has failed, swapping in a known-good one to isolate the fault.","points":20},{"text":"Whether your control timing overlaps the motor's PWM.","points":10}]},{"question":"Your robotic arm has to repeat the same motion accurately, fifty times in a row. What matters most?","options":[{"text":"A rigid frame with minimal backlash in the joints.","points":40},{"text":"Encoders and closed-loop feedback, so the arm knows where it actually is.","points":30},{"text":"Motors sized with enough headroom that they never stall under load. Acceleration profiles gentle enough to keep the arm from overshooting.","points":10},{"text":"Motors sized with enough headroom that they never stall under load. Acceleration profiles gentle enough to keep the arm from overshooting.","points":10}]}]},{"name":"Media & Promotions","questions":[{"question":"How would you rate your current editing ability? 🟡","options":[{"text":"Beginner: still learning the basics 🟢","points":40},{"text":"Intermediate: can independently create good content 🔵","points":30},{"text":"Advanced: comfortable with complex edits, effects, sound, and/or color","points":20},{"text":"I know where the transition button is, so basically advanced 🎬","points":10}]},{"question":"Which editing software are you most comfortable using? 🎨","options":[{"text":"Premiere Pro / After Effects 📱","points":40},{"text":"DaVinci Resolve 🗿","points":30},{"text":"CapCut / VN / Other","points":20},{"text":"Microwave ✅","points":10}]},{"question":"You receive hundreds of unorganized clips from an event. What’s your first step? 🙏🏽","options":[{"text":"Organize and label the footage ✌🏽","points":40},{"text":"Watch through everything and shortlist clips 💀","points":30},{"text":"Start editing on the go","points":20},{"text":"Ctrl+A → Del → problem solved","points":10}]},{"question":"You’re asked to learn a new skill for a specific project that you’re unfamiliar with. What’s your 📚 approach? 🫂","options":[{"text":"Learn what I need and give it a shot 🙅🏽","points":40},{"text":"Ask someone experienced to guide me 🫡","points":30},{"text":"Try to avoid it and stick to what I already know","points":20},{"text":"YouTube tutorial at 2× speed. We move","points":10}]},{"question":"You’ve spent hours making a reel, but your directors ask you to change most of it. What do 👍🏽 you do? 🤔","options":[{"text":"Take the feedback positively and improve the work 😤","points":40},{"text":"Ask why the changes are needed and then revise accordingly 😭","points":30},{"text":"Defend my original work and only make the changes I agree with","points":20},{"text":"“But I spent FOUR HOURS on this.”","points":10}]},{"question":"SPADES has a workshop tomorrow and needs MnP coverage early morning, but you also 🤙🏽 have an assignment due the same time. What do you do? 🔥","options":[{"text":"Plan ahead and make time for both 😤","points":40},{"text":"Let the team know my availability and contribute where I can 🥀","points":30},{"text":"Prioritize the assignment and skip the coverage","points":20},{"text":"Show up to the workshop and hope my instructor understands","points":10}]},{"question":"During a shoot, the approved, pre-planned content idea isn’t working. What do you do? 🫂","options":[{"text":"Improvise and suggest a new approach ‼️","points":40},{"text":"Ask the team for ideas and adapt 🙏🏽 😭","points":30},{"text":"Stick to the original plan","points":20},{"text":"Leave it and hope the directors don’t notice","points":10}]},{"question":"You are assigned a deliverable with a team of 3 people, but they all have different ideas for 🥰 the shoot. What do you do? 🤩","options":[{"text":"Discuss with them and choose what works best ❓","points":40},{"text":"Push for the idea I think is strongest 😭","points":30},{"text":"Go with whatever the majority prefers","points":20},{"text":"Make all three and let future generations decide 😝","points":10}]},{"question":"Which sounds most like you during a society event? 😛","options":[{"text":"I’m usually the one talking to everyone and getting people involved 🤨","points":40},{"text":"I’m comfortable meeting new people but prefer staying focused on the task 😱","points":30},{"text":"I’m more comfortable working behind the scenes","points":20},{"text":"If there’s a camera, I will eventually end up in front of it 🫣","points":10}]},{"question":"What motivates you most to join SPADES M&P? 🫡","options":[{"text":"Creating content and improving my creative skills 💥","points":40},{"text":"Meeting people and being part of a fun, active team 👊🏽","points":30},{"text":"Getting hands-on experience with media and event coverage","points":20},{"text":"All of the above — I want to make cool shit with cool people","points":10}]}]},{"name":"Science Crime Busters","questions":[{"question":"You have to design a mystery where participants receive 6 clues. Which setup would you find most interesting to develop?","options":[{"text":"All 6 clues point toward the same suspect, but some are stronger than others.","points":10},{"text":"4 clues point toward one explanation, while 2 subtly support a competing explanation.","points":40},{"text":"Each clue points toward a different suspect, leaving participants to decide which clues matter.","points":20},{"text":"The clues seem unrelated initially but become connected as participants uncover more information.","points":30}]},{"question":"You test your case and realize almost every group solves it within five minutes. What would you change first?","options":[{"text":"Add another layer to the reasoning required to connect the existing clues.","points":40},{"text":"Introduce a misleading clue that initially supports an alternative explanation.","points":30},{"text":"Remove some of the more obvious clues and make participants work with less information.","points":10},{"text":"Add an additional stage to the case so solving it requires reaching multiple conclusions.","points":20}]},{"question":"A participant solves your case using a method your team never intended, but their reasoning is internally consistent. What would you be most interested in?","options":[{"text":"Whether their answer matches the intended solution.","points":10},{"text":"Whether their reasoning can actually be supported by the evidence provided.","points":40},{"text":"Whether other teams could reasonably arrive at the same conclusion.","points":20},{"text":"Whether their approach exposes an unintended weakness in the case.","points":30}]},{"question":"Halfway through designing a round, you realize your original idea is much harder to execute than expected. Which direction would you lean toward?","options":[{"text":"Simplify the original idea while preserving its central concept.","points":40},{"text":"Replace the difficult component with a different mechanism that tests the same skill.","points":30},{"text":"Restructure the round around the parts that are already working.","points":20},{"text":"Keep the difficult component and try to find a way to make it work.","points":10}]},{"question":"You have one final clue to add to a case. Which kind would you choose?","options":[{"text":"One that strongly confirms the most likely explanation.","points":10},{"text":"One that makes participants reconsider an assumption they have already made.","points":30},{"text":"One that connects two pieces of evidence that initially seemed unrelated.","points":40},{"text":"One that introduces a new possibility without immediately resolving it.","points":20}]},{"question":"You’re brainstorming a new SCB round from scratch. What would you naturally start with?","options":[{"text":"A cool storyline or setting.","points":20},{"text":"A skill or type of thinking you want participants to use.","points":40},{"text":"A unique game mechanic that could make the round memorable.","points":30},{"text":"An interesting scientific or forensic concept that could be incorporated.","points":10}]},{"question":"While designing the case for SCB, what would you priotitize?","options":[{"text":"Creating a complex network of information without a clear answer, leaving room for question in all suspects","points":10},{"text":"A simple case that eventually hints strongly towards particular suspect(s)","points":20},{"text":"A complex yet guided case that relies on theatrics and more direct reveals to lead to a more simple answer","points":30},{"text":"A case that runs deep and leaves room for many different avenues of exploration and multiple correct conclusions, following a broadly linear narrative","points":40}]},{"question":"After reviewing what teams are thinking post round, you find that most teams are coming to virtually the same answer, even with differing analysis. How would you respond?","options":[{"text":"Keep everything as is and rely on properly reviewing how they reached their conclusion to judge them","points":30},{"text":"Add a few more clues that hint towards a second possibility to diversify answers in an effort to weed out unsure teams","points":10},{"text":"Add more complexity in the final round and judge top teams on the basis of overall deduction skills across all three rounds to add another layer of marking","points":40},{"text":"Increase amount/size of deliverables to evaluate just how much and how deep every team has thought of the case, alongside how many angles they considered.","points":20}]}]},{"name":"Design","questions":[{"question":"Two people you are collaborating with on the design team have very different visual styles for the same event campaign, and you need one unified identity. What do you do?","options":[{"text":"Bring all the team together, identify strong elements from each style, and merge them into one direction with clear reasoning.","points":40},{"text":"Pick the style you personally prefer and explain your decision to the team afterward.","points":30},{"text":"Let all designers keep working separately and try to combine the outputs later.","points":20},{"text":"Escalate the decision entirely to a director and wait for them to decide.","points":10}]},{"question":"The department director shares a design they made themselves for an upcoming event, and you disagree with their design choices, and it doesn't fit the event's tone. They seem happy with it and are about to send it off. What do you do as a team member?","options":[{"text":"Say something before it goes out, focused on the work, not the person.","points":40},{"text":"Ask a clarifying question first ) to understand their intent before deciding whether your concern still stands.","points":30},{"text":"Say nothing directly, but mention your concerns to another teammate to see if they feel the same way before anyone raises it.","points":20},{"text":"Stay quiet, since it's the director's call and their name/authority is on the decision either way.","points":10}]},{"question":"You have two tasks due the same day: one is a small, low visibility internal graphic; the other is a flashier social media post that will get a lot of views but isn't due until later that evening. You only have time to give one your full effort right now. Which do you prioritize, and why?","options":[{"text":"The internal graphic, visibility isn't the same as importance, and reliability on the boring work builds more trust over time.","points":40},{"text":"The social post, it's later in the day, so you do the internal one adequately now and save your best effort for the piece more people will see.","points":30},{"text":"Split your effort evenly across both rather than fully prioritizing either, aiming to avoid a truly weak version of anything.","points":20},{"text":"Whichever one you personally find more interesting to work on, since motivation affects output quality.","points":10}]},{"question":"You're told a design \"needs to pop more,\" but you personally think the current version is stronger and more tasteful. What's your next move?","options":[{"text":"Make the requested change as asked, then separately share a version closer to your original so both can be compared side by side.","points":40},{"text":"Try to understand what \"pop more\" is actually solving for before deciding how to respond.","points":30},{"text":"Adjust the design to add more visual intensity, trusting that the person asking has context you might not.","points":20},{"text":"Keep the design mostly as is, making only minor tweaks, since you believe restraint is the stronger choice here.","points":10}]},{"question":"You receive harsh criticism about a design you're genuinely proud of. How do you respond?","options":[{"text":"Separate your emotional reaction from the useful parts of the feedback, ask clarifying questions, and use it to improve the next version.","points":40},{"text":"Feel upset initially, but eventually come around and incorporate the feedback after some reflection.","points":30},{"text":"Defend the design strongly without giving the criticism much real consideration.","points":20},{"text":"Avoid attempting similar designs in the future to sidestep negative feedback.","points":10}]},{"question":"Your team is behind schedule on a major visual campaign and people are stressed. What role do you take?","options":[{"text":"Reassess priorities, delegate tasks based on people's strengths, and keep morale up while pushing toward the deadline.","points":40},{"text":"Focus on completing your own tasks well and trust that others will catch up.","points":30},{"text":"Take on other people's work yourself to make sure everything gets done.","points":20},{"text":"Point out who's falling behind to create a sense of urgency.","points":10}]},{"question":"You have an idea for a new design initiative that's outside your usual responsibilities. What do you do?","options":[{"text":"Pitch it to your team or department head with a clear plan of what it would take to execute and what resources are needed.","points":40},{"text":"Mention the idea casually to gauge interest before putting together a formal pitch.","points":30},{"text":"Keep it to yourself, since it falls outside your usual role.","points":20},{"text":"Start executing it on your own without discussing it with anyone first.","points":10}]},{"question":"You have to design a poster for an event with the most boring possible topic. How do you make it not put people to sleep?","options":[{"text":"Find one genuinely funny or unexpected angle on the topic and build the whole design around that idea.","points":40},{"text":"Keep it clean and minimal and let good typography and whitespace do the work instead of trying to force excitement.","points":30},{"text":"Lean on bold colors and bigger fonts than usual to make it visually loud even if the content stays dry.","points":20},{"text":"Add a meme or trending reference to make it feel more relatable and current.","points":10}]}]},{"name":"Marketing & External Relations","questions":[{"question":"You are approaching a brand for sponsorship for your university’s flagship event. The brand asks, “What’s in it for us?” What should you prioritize in your response?","options":[{"text":"Clearly present the brand visibility, target audience, deliverables, and measurable value they will receive in exchange for their sponsorship.","points":40},{"text":"Tell them that many students will attend the event and their brand will get good exposure.","points":30},{"text":"Emphasize that other well-known brands have already sponsored the event.","points":20},{"text":"Offer them a discounted sponsorship package immediately to convince them. ⸻","points":10}]},{"question":"A company cannot provide an in-cash sponsorship but offers products worth approximately PKR 100,000 for your event. What is the most appropriate approach?","options":[{"text":"Evaluate the products against your event’s actual needs and negotiate a barter arrangement with clearly defined deliverables and equivalent value.","points":40},{"text":"Accept the products because PKR 100,000 in products is still better than receiving nothing.","points":30},{"text":"Ask them to increase the product quantity before agreeing.","points":20},{"text":"Reject the offer because your department only deals with monetary sponsors. ⸻","points":10}]},{"question":"A potential sponsor says, “Your sponsorship packages are too expensive.” What would be the strongest next step?","options":[{"text":"Ask about their budget and objectives, understand their constraints, and explore a customized package that preserves value for both sides.","points":40},{"text":"Immediately reduce the price by 30% to close the deal.","points":30},{"text":"Tell them another brand has agreed to pay the full amount.","points":20},{"text":"Thank them and move on to another sponsor. ⸻","points":10}]},{"question":"You have contacted 30 brands for an event. Ten have opened your proposal, but only two have responded. What should you do?","options":[{"text":"Analyze the outreach and follow-up process, personalize follow-ups, refine the value proposition, and prioritize high-potential leads.","points":40},{"text":"Send the exact same message to another 30 brands.","points":30},{"text":"Follow up with all ten brands repeatedly until they respond.","points":20},{"text":"Assume that brands are simply not interested in sponsoring university events. ⸻","points":10}]},{"question":"You are responsible for inviting a high-profile guest speaker for an event. The speaker’s assistant asks for more information before confirming. What should you send first?","options":[{"text":"A concise professional brief covering the event, audience, date/time, expected role, topic/theme, format, and relevant organizational details.","points":40},{"text":"A long message explaining everything about your society and all previous events.","points":30},{"text":"Only the event poster and ask whether they are interested.","points":20},{"text":"Ask them to attend first and provide the details after they agree. ⸻","points":10}]},{"question":"A confirmed panelist cancels two days before an event. You have three potential replacements: a highly relevant expert who may be unavailable, a moderately relevant expert who is available, and a famous personality with little connection to the topic. What should you do?","options":[{"text":"Contact the highly relevant expert immediately while simultaneously approaching the available relevant candidate as a backup.","points":40},{"text":"Invite the famous personality because their name will attract more attendees.","points":30},{"text":"Wait for the original panelist to reconsider before contacting anyone else.","points":20},{"text":"Cancel the panel because finding a replacement at short notice is difficult. ⸻","points":10}]},{"question":"A sponsor agrees to provide PKR 50,000, but your team later realizes that one of the promised deliverables cannot realistically be provided. What is the best response?","options":[{"text":"Communicate the issue proactively, explain why the deliverable cannot be fulfilled, and negotiate an equivalent alternative that maintains the sponsor’s value.","points":40},{"text":"Provide the deliverable anyway, even if it compromises the event.","points":30},{"text":"Remove the deliverable without informing the sponsor.","points":20},{"text":"Wait until after the event and explain the situation if they complain. ⸻","points":10}]},{"question":"You are negotiating with a brand that wants exclusive category rights at your event but is offering significantly less than your expected sponsorship value. What should you do?","options":[{"text":"Assess the value of exclusivity, calculate its opportunity cost, and negotiate the sponsorship amount or scope accordingly.","points":40},{"text":"Give them exclusivity because securing one sponsor is better than securing multiple sponsors.","points":30},{"text":"Reject exclusivity immediately without discussing alternatives.","points":20},{"text":"Agree to exclusivity and approach competing brands secretly. ⸻","points":10}]},{"question":"A potential judge for a competition has excellent credentials but has not responded to your first two messages. What is the most professional approach?","options":[{"text":"Send a concise, respectful follow-up through the appropriate channel, reiterating the key details and making it easy for them to respond.","points":40},{"text":"Send multiple messages across all their social media accounts.","points":30},{"text":"Ask someone you know to pressure them into responding.","points":20},{"text":"Remove them immediately and never contact them again. ⸻","points":10}]},{"question":"Your Marketing and External Relations teams are both approaching the same company for an event—Marketing for sponsorship and ERA for a guest speaker. What should you do?","options":[{"text":"Coordinate internally, establish a single communication strategy, and approach the company with a unified proposal covering both opportunities.","points":40},{"text":"Let both teams continue independently so the company has more opportunities to engage.","points":30},{"text":"Ask the team that contacts the company first to handle everything.","points":20},{"text":"Stop one team from contacting the company without informing them why.","points":10}]}]},{"name":"Human Resource","questions":[{"question":"You are helping organize a GBM, but attendance has been dropping over the past few sessions. What would you do?","options":[{"text":"Look into why attendance is dropping, gather feedback from members, and redesign the GBM around what would actually make people want to attend.","points":40},{"text":"Try introducing more interactive activities and see whether engagement improves in the next few sessions.","points":30},{"text":"Make the GBM shorter and announce it more frequently so people are reminded to attend.","points":20},{"text":"Assume people are simply busy and continue running GBMs the same way.","points":10}]},{"question":"A new member joins SPADES and barely speaks during their first few meetings. They seem interested but aren't participating much. What would you do?","options":[{"text":"Check in with them casually, understand how they're settling in, and find a low-pressure way for them to become involved.","points":40},{"text":"Give them a small responsibility during the next activity so they have a natural opportunity to participate.","points":30},{"text":"Encourage them to speak up more during meetings and give them time to adjust.","points":20},{"text":"Assume they're not interested and wait for them to approach HR themselves.","points":10}]},{"question":"A member who used to be extremely active has suddenly become distant and is missing several society tasks. What is your first move?","options":[{"text":"Reach out privately, check whether something has changed, and understand the situation before deciding what action is appropriate.","points":40},{"text":"Ask whether they need help or whether their workload needs to be adjusted temporarily.","points":30},{"text":"Inform their department head that the member seems disengaged and let them handle it.","points":20},{"text":"Call them out during the next meeting because everyone has responsibilities to fulfill.","points":10}]},{"question":"You are planning a society hangout, but the HR team has very different ideas about what to do. Everyone is attached to their own idea and planning has stalled. What do you do?","options":[{"text":"Identify what the hangout is actually meant to achieve, such as bonding, relaxation, or welcoming new members, and choose an activity that best fits that goal.","points":40},{"text":"Shortlist the strongest ideas and quickly vote or test them with the team.","points":30},{"text":"Combine parts of everyone's ideas into one larger activity so nobody feels ignored.","points":20},{"text":"Let the loudest or most senior person decide so planning can move forward.","points":10}]},{"question":"You are responsible for keeping the HR database updated. You discover that several members have missing or inconsistent information shortly before an important recruitment cycle. What do you do?","options":[{"text":"Identify the inconsistencies, verify the information from reliable sources, and establish a clear process to keep the database accurate going forward.","points":40},{"text":"Fix the most important missing information first and create a list of remaining issues to resolve later.","points":30},{"text":"Ask members to update their own information and assume most of the errors will be corrected.","points":20},{"text":"Leave the existing database alone because fixing everything this close to recruitment would take too much time.","points":10}]},{"question":"Another department suddenly needs volunteers for an important event task. Your HR team is already busy with its own work. What do you do?","options":[{"text":"Check the team's capacity, identify what can be temporarily deprioritized, and coordinate volunteers without compromising critical HR responsibilities.","points":40},{"text":"Ask available HR members whether they can volunteer and then distribute the extra workload fairly.","points":30},{"text":"Send whoever is free at the moment, even if they aren't particularly suited to the task.","points":20},{"text":"Refuse because HR already has its own responsibilities.","points":10}]},{"question":"You have been asked to make the slides for the next GBM, but the information from different departments is arriving late and in inconsistent formats. The GBM is tomorrow. What do you do?","options":[{"text":"Identify the essential information, standardize it into a clear structure, and follow up directly with departments on anything genuinely missing or unclear.","points":40},{"text":"Build the presentation around the information you already have and leave clearly marked spaces for anything still pending.","points":30},{"text":"Ask the HR head to chase every department for their information before you start making the slides.","points":20},{"text":"Put all the information into the slides as received, even if the formatting and details are inconsistent.","points":10}]},{"question":"A member tells you privately that they feel their department doesn't value their contributions. What do you do?","options":[{"text":"Listen first and try to understand specific examples, and then work with the relevant people to address the issue constructively.","points":40},{"text":"Ask what kind of recognition or support they feel is missing and see whether something practical can be changed.","points":30},{"text":"Tell their department head that the member seems unhappy and ask them to check in.","points":20},{"text":"Immediately agree with the member and tell them that their department is clearly treating them unfairly.","points":10}]},{"question":"You are asked why you want to join HR. Which answer best reflects what would make someone genuinely suited to the department?","options":[{"text":"I like working with people, and I want to help build a society where members feel included, supported, motivated, and able to contribute.","points":40},{"text":"I enjoy organizing activities, communicating with people, and helping things run smoothly behind the scenes.","points":30},{"text":"I think HR would help me become more confident and improve my communication skills.","points":20},{"text":"HR seems like the fun department because you get to hang out with everyone and attend events.","points":10}]},{"question":"You accidentally send an incorrect announcement to the entire society about an upcoming event. You realize the mistake shortly afterward. What do you do?","options":[{"text":"Correct the information promptly, and send the corrected information reaches everyone who received the original message.","points":40},{"text":"Inform your HR Head immediately and ask how they would like the correction handled.","points":30},{"text":"Delete the original message if possible and send the correct one without drawing attention to the mistake.","points":20},{"text":"Wait to see whether anyone notices before deciding whether a correction is necessary.","points":10}]}]}];
const STANDARD_QUESTIONS=[{"question":"During a society event, you notice that a member repeatedly makes comments toward another member that seem to be making them uncomfortable. The person hasn’t explicitly complained, but you notice them trying to avoid the member. What would you do?","options":[{"text":"Check in privately with the person who seems uncomfortable, listen without making assumptions, and, depending on their comfort, help them approach the appropriate society authority or reporting mechanism.","points":40},{"text":"Speak privately to the person making the comments and let them know that their behaviour has been noticed and may be making someone uncomfortable, while encouraging them to be more mindful.","points":30},{"text":"Keep an eye on the situation and speak to the person being affected if the behaviour continues or if they indicate that they want help.","points":20},{"text":"Ask a few trusted society members whether they have noticed the same behaviour so you can better understand the situation before deciding how to proceed.","points":10}]},{"question":"You have an important academic deadline tomorrow, while a society task you are responsible for is also due tomorrow. You realize you cannot give both tasks the attention they require. What would you do?","options":[{"text":"Prioritize based on urgency and consequences, communicate with your team as early as possible, and discuss whether the remaining work can be redistributed or the deadline adjusted.","points":40},{"text":"Finish as much of the society task as possible and let the team know where things stand, while making sure your academic work is also completed.","points":30},{"text":"Focus on your academic deadline first, then complete the society task afterward, even if it means submitting the society work later than expected.","points":20},{"text":"Try to handle both tasks yourself by putting in extra hours, even if the quality of one or both tasks may suffer.","points":10}]},{"question":" function showBubbleStep(i){
 bubbleStep=i;
 document.querySelectorAll(".convo-step").forEach(el=>{ el.style.display = (el.dataset.step==String(i)) ? "block" : "none"; });
 document.querySelectorAll(".step-dot").forEach((d,idx)=>{
  d.classList.toggle("active", idx===i);
  d.classList.toggle("done", idx<i);
 });
 const back=document.getElementById("bubbleBack"); if(back) back.disabled = (i===0);
 const next=document.getElementById("bubbleNext"); if(next) next.textContent = (i===BUBBLE_STEP_KEYS.length-1) ? "ENTER CAMPUS →" : "NEXT →";
 const bErr=document.getElementById("bubbleErr"); if(bErr) bErr.textContent="";
 const activeEl=document.querySelector(`.convo-step[data-step="${i}"] input:not([type=hidden])`);
 if(activeEl) setTimeout(()=>activeEl.focus(),50);
}
function bubbleBack(){ if(bubbleStep>0) showBubbleStep(bubbleStep-1); }
function bubbleNext(){
 const key=BUBBLE_STEP_KEYS[bubbleStep];
 const val=document.getElementById(key).value.trim();
 const bErr=document.getElementById("bubbleErr");
 if(!val){ bErr.textContent="Please fill this in before continuing."; return; }
 if(key==="email" && !/^[^\s@]+@lums\.edu\.pk$/i.test(val)){ bErr.textContent="Please enter a valid LUMS email ending in @lums.edu.pk."; return; }
 if(key==="phone" && (!/^[0-9]+$/.test(val) || val.length<10)){ bErr.textContent="Please enter a valid phone number (numbers only, at least 10 digits)."; return; }
 if(bubbleStep===BUBBLE_STEP_KEYS.length-1){ startApp(); return; }
 showBubbleStep(bubbleStep+1);
}
function selectChip(fieldId,value,btnEl,isGender){
 document.getElementById(fieldId).value=value;
 const row=btnEl.parentElement;
 row.querySelectorAll(".chip-bubble").forEach(b=>b.classList.remove("selected"));
 btnEl.classList.add("selected");
 if(isGender) previewGender(value);
 document.getElementById("bubbleErr").textContent="";
}
function previewGender(g){
 const p=document.getElementById('player');
 if(p) p.classList.toggle('gender-female',g==='Female');
}

function randomizeOptions(options){
 const a=options.slice();
 for(let i=a.length-1;i>0;i--){
  const r=new Uint32Array(1);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(r); else r[0]=Math.floor(Math.random()*4294967296);
  const j=r[0]%(i+1); [a[i],a[j]]=[a[j],a[i]];
 }
 window._displayedOptions=a;
 return a;
}
let questionTimer=null, questionTimeLeft=90, questionTimerToken=0;
function stopQuestionTimer(){ if(questionTimer){clearInterval(questionTimer);questionTimer=null;} }
function startQuestionTimer(onExpire){
 stopQuestionTimer(); const token=++questionTimerToken; questionTimeLeft=90;
 const el=document.getElementById("questionTimer");
 function paint(){ if(!el)return; el.textContent=`TIME ${String(Math.floor(questionTimeLeft/60)).padStart(2,"0")}:${String(questionTimeLeft%60).padStart(2,"0")}`; el.classList.toggle("urgent",questionTimeLeft<=10); }
 paint(); questionTimer=setInterval(()=>{ if(token!==questionTimerToken){stopQuestionTimer();return;} questionTimeLeft--; paint(); if(questionTimeLeft<=0){stopQuestionTimer(); onExpire();}},1000);
}

 ${randomizeOptions(q.options).map((o,i)=>`<button class="choice" onclick="answerStandard(${i})"><b>${String.fromCharCode(65+i)}.</b> ${esc(o.text)}</button>`).join("")}

function shuffleArray(arr){

  const world = document.querySelector('.world') || document.querySelector('#world') || document.querySelector('.campus');
  if(!player) return;

  // Keep a single, clearly defined player position in percentages.
  let px = parseFloat(player.dataset.x || 50);
  let py = parseFloat(player.dataset.y || 78);
  const speed = 1.15;
  const keys = new Set();
  window._joystickX = 0; window._joystickY = 0;

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function stations(){
    return [...document.querySelectorAll('.station')];
  }

  function distanceTo(el){
    const x = parseFloat(el.style.left);
    const y = parseFloat(el.style.top);
    return Math.hypot(px-x, py-y);
  }

  function updateNear(){
    let nearest=null, best=Infinity;
    stations().forEach(s=>{
      const d=distanceTo(s);
      if(d<best){best=d;nearest=s;}
      s.classList.remove('near');
    });
    // Only the closest station becomes active, preventing multiple stations
    // from being selectable at the same time on the compact mobile grid.
    const threshold = window.matchMedia('(max-width:700px),(pointer:coarse)').matches ? 8.0 : 9;
    const nextNear = nearest && best < threshold ? nearest : null;
    const previousNear = window._nearStation;
    if(nextNear) nextNear.classList.add('near');
    window._nearStation = nextNear;
    // Walking near a station only highlights it. The description opens ONLY when
    // the player explicitly walks in by pressing the WALK IN button.
    // Do NOT auto-open the description just because the player crossed a station.
    // Do NOT auto-select. When the player gets close, show one small WALK IN bubble.
    stations().forEach(s=>{ const oldBubble=s.querySelector('.station-action'); if(oldBubble) oldBubble.remove(); });
    if(nextNear){
      const bubble=document.createElement('button');
      bubble.type='button';
      bubble.className='station-action';
      bubble.textContent='WALK IN';
      bubble.setAttribute('aria-label','Select '+(nextNear.querySelector('.name')?.textContent||'department'));
      bubble.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();});
      bubble.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        const stationName = nextNear.querySelector('.name')?.textContent || '';
        const dept = DATA.find(d=>d.name===stationName);
        if(dept) showStationDescription(dept);
      });
      nextNear.appendChild(bubble);
    }
  }

  function render(){
    player.style.left = px + '%';
    player.style.top = py + '%';
    player.dataset.x=px; player.dataset.y=py;
    updateNear();
  }

  function move(){
    let dx=0,dy=0;
    if(keys.has('ArrowLeft')||keys.has('a')) dx-=1;
    if(keys.has('ArrowRight')||keys.has('d')) dx+=1;
    if(keys.has('ArrowUp')||keys.has('w')) dy-=1;
    if(keys.has('ArrowDown')||keys.has('s')) dy+=1;
    if(window._joystickX || window._joystickY){ dx += window._joystickX; dy += window._joystickY; }

    if(dx||dy){
      const mag=Math.hypot(dx,dy)||1;
      px=clamp(px+(dx/mag)*speed,3,97);
      py=clamp(py+(dy/mag)*speed,8,95);
      player.classList.add('walk');
      // Slight squash/bounce while moving.
      player.style.rotate = (dx<0 ? '-3deg' : dx>0 ? '3deg' : '0deg');
      render();
    }else{
      player.classList.remove('walk');
      player.style.rotate='0deg';
    }
    requestAnimationFrame(move);
  }

  function isTypingTarget(el){
    return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT' || el.isContentEditable);
  }

  window.addEventListener('keydown',e=>{
    // Never hijack normal typing in the registration/application forms.
    if(isTypingTarget(document.activeElement)) return;

    const k=e.key;

    // When the WALK IN option is visible, ENTER activates that station.
    if(k==='Enter' && window._nearStation){
      e.preventDefault();
      e.stopPropagation();
      const walkInButton = window._nearStation.querySelector('.station-action');
      if(walkInButton){
        walkInButton.click();
      }
      return;
    }

    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(k)){
      e.preventDefault();
      keys.add(k.toLowerCase());
    }
  });

  window.addEventListener('keyup',e=>{
    if(isTypingTarget(document.activeElement)) return;
    keys.delete(e.key.toLowerCase());
  });

  render();
  requestAnimationFrame(move);
})();
</script>

<script>
(function(){
 const mobilePositions=[
  [18,42],[50,42],[82,42],
  [18,47.5],[50,47.5],[82,47.5],
  [18,53],[50,53],[82,53],
  [18,58.5],[50,58.5],[82,58.5],
  [18,64],[50,64],[82,64],
  [18,69.5],[50,69.5],[82,69.5],
  [18,75],[50,75],[82,75],
  [18,80.5],[50,80.5],[82,80.5],
  [18,86],[50,86],[82,86]
 ];
 function layout(){
  if(!window.matchMedia("(max-width:700px),(pointer:coarse)").matches)return;
  document.querySelectorAll(".station").forEach((el,i)=>{
   const pos=mobilePositions[i%mobilePositions.length];
   el.style.left=pos[0]+"%";el.style.top=pos[1]+"%";
  });
 }
 const joystick=document.getElementById("mobileJoystick");
 const knob=document.getElementById("joystickKnob");
 let joyPointer=null;
 function setJoystick(clientX,clientY){
   if(!joystick||!knob)return;
   const r=joystick.getBoundingClientRect();
   const cx=r.left+r.width/2, cy=r.top+r.height/2;
   let dx=clientX-cx, dy=clientY-cy;
   const max=33;
   const mag=Math.hypot(dx,dy)||1;
   if(mag>max){dx=dx/mag*max;dy=dy/mag*max;}
   knob.style.transform=`translate(${dx}px,${dy}px)`;
   window._joystickX=dx/max; window._joystickY=dy/max;
 }
 function resetJoystick(){joyPointer=null;if(knob)knob.style.transform="translate(0,0)";window._joystickX=0;window._joystickY=0;}
 if(joystick){
   joystick.addEventListener("pointerdown",e=>{e.preventDefault();joyPointer=e.pointerId;joystick.setPointerCapture?.(e.pointerId);setJoystick(e.clientX,e.clientY);});
   joystick.addEventListener("pointermove",e=>{if(joyPointer===e.pointerId){e.preventDefault();setJoystick(e.clientX,e.clientY);}});
   joystick.addEventListener("pointerup",e=>{if(joyPointer===e.pointerId)resetJoystick();});
   joystick.addEventListener("pointercancel",e=>{if(joyPointer===e.pointerId)resetJoystick();});
 }
 // Apply positions after the stations have been created, and again after layout settles.
 layout(); setTimeout(layout,100);

})();
</script>

<script>
(function(){
  var layer=document.getElementById("fireworks-layer");
  if(!layer) return;
  var colors=["#ff5c7a","#ffd23f","#4fd6ff","#7dff8a","#c58bff","#ff9d4d","#5cffe0"];
  var reduceMotion=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timer=null;

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function launchFirework(){
    if(!document.body.classList.contains("night")) return;
    var layerRect=layer.getBoundingClientRect();
    if(layerRect.width===0||layerRect.height===0) return;

    var xPct=rand(12,88);
    var burstYPct=rand(14,42);
    var color=colors[Math.floor(rand(0,colors.length))];

    var rocket=document.createElement("div");
    rocket.className="fw-rocket";
    rocket.style.left=xPct+"%";
    rocket.style.color=color;
    var riseDist=-(layerRect.height*(1-burstYPct/100));
    var dur=rand(700,1000);
    rocket.style.setProperty("--fw-rise",riseDist+"px");
    rocket.style.setProperty("--fw-dur",dur+"ms");
    layer.appendChild(rocket);

    setTimeout(function(){
      rocket.remove();
      if(!document.body.classList.contains("night")) return;
      var burst=document.createElement("div");
      burst.className="fw-burst";
      burst.style.left=xPct+"%";
      burst.style.top=burstYPct+"%";
      burst.style.color=color;
      var count=Math.floor(rand(22,34));
      for(var i=0;i<count;i++){
        var angle=(Math.PI*2*i)/count + rand(-.2,.2);
        var dist=rand(30,70);
        var p=document.createElement("div");
        p.className="fw-particle";
        p.style.setProperty("--fw-x",(Math.cos(angle)*dist)+"px");
        p.style.setProperty("--fw-y",(Math.sin(angle)*dist)+"px");
        if(Math.random()<0.3) p.style.color=colors[Math.floor(rand(0,colors.length))];
        burst.appendChild(p);
      }
      layer.appendChild(burst);
      setTimeout(function(){ burst.remove(); },1200);
    },dur);
  }

  function scheduleNext(){
    var delay=rand(900,2200);
    timer=setTimeout(function(){
      var bursts=Math.floor(rand(1,4));
      for(var i=0;i<bursts;i++){
        setTimeout(launchFirework, rand(0,300));
      }
      scheduleNext();
    },delay);
  }

  if(!reduceMotion){
    scheduleNext();
  }
})();
</script>
